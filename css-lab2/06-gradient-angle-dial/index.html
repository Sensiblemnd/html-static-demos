<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Angle Dial</title>
<link rel="stylesheet" href="../_shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Gradient Angle Dial</h1>
  <p>One slider-linked <code>--_f</code>, multiplied by <code>360deg</code>, rotates a <code>conic-gradient()</code> and a pointer overlay in lockstep — a live color-wheel dial built from a single interpolated angle.</p>
</header>
<div class="stage">
  <div class="stage-control">
    <label for="angle">Angle</label>
    <input type="range" id="angle" class="range-slider" value="0">
  </div>
  <div class="dial">
    <div class="dial-wheel"></div>
    <div class="dial-pointer"></div>
  </div>
</div>
</body>
</html>
