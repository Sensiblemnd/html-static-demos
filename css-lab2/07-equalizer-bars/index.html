<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equalizer Bars</title>
<link rel="stylesheet" href="../_shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Equalizer Bars</h1>
  <p>Six sliders, six independent registered properties, six separate view-timelines — one per thumb. Each bar's height reads straight from its own slider's live value, showing the technique scales to many simultaneous inputs on one page.</p>
</header>
<div class="stage">
  <div class="eq">
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f1" value="30" aria-label="Band 1">
      <div class="eq-bar eq-bar--1"></div>
    </div>
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f2" value="55" aria-label="Band 2">
      <div class="eq-bar eq-bar--2"></div>
    </div>
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f3" value="80" aria-label="Band 3">
      <div class="eq-bar eq-bar--3"></div>
    </div>
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f4" value="65" aria-label="Band 4">
      <div class="eq-bar eq-bar--4"></div>
    </div>
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f5" value="40" aria-label="Band 5">
      <div class="eq-bar eq-bar--5"></div>
    </div>
    <div class="eq-band">
      <input type="range" class="range-slider range-slider--f6" value="20" aria-label="Band 6">
      <div class="eq-bar eq-bar--6"></div>
    </div>
  </div>
</div>
</body>
</html>
