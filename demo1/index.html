<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Grid</title>
  </head>
  <body>
<h1>Timeline Grid</h1>
  <div class="timeline-scroll-container">
    <div class="grid-timeline">
      
      <!-- TIME SLOTS INDEX HEADERS -->
      <div class="header-container">
        <div class="header-row">7:30 AM</div><div class="header-row">8:00 AM</div>
        <div class="header-row">8:30 AM</div><div class="header-row">9:00 AM</div>
        <div class="header-row">9:30 AM</div><div class="header-row">10:00 AM</div>
        <div class="header-row">10:30 AM</div><div class="header-row">11:00 AM</div>
        <div class="header-row">11:30 AM</div><div class="header-row">12:00 PM</div>
        <div class="header-row">12:30 PM</div><div class="header-row">1:00 PM</div>
        <div class="header-row">1:30 PM</div><div class="header-row">2:00 PM</div>
        <div class="header-row">2:30 PM</div><div class="header-row">3:00 PM</div>
        <div class="header-row">3:30 PM</div><div class="header-row">4:00 PM</div>
        <div class="header-row">4:30 PM</div><div class="header-row">5:00 PM</div>
      </div>

      <!-- ROW 2 LAYER -->
      <!-- Background track: divider lines drawn via CSS background-image -->
      <div class="row-background row-2"></div>
      <!-- Colored items sitting precisely on top -->
      <div class="block row-2 r2-b1">1 hr</div>
      <div class="block row-2 r2-b2">30m</div>
      <div class="block row-2 r2-b3">2 hrs</div>
      <div class="block row-2 r2-b4">6.5 hrs</div>

      <!-- ROW 3 LAYER -->
      <div class="row-background row-3"></div>
      <div class="block row-3 r3-b1">2.5 hrs</div>
      <div class="block row-3 r3-b2">3 hrs</div>
      <div class="block row-3 r3-b3">2.5 hrs</div>

      <!-- ROW 4 LAYER -->
      <div class="row-background row-4"></div>
      <div class="block row-4 r4-b1">4 hrs</div>
      <div class="block row-4 r4-b2">4 hrs</div>

    </div>
  </div>
  </body>
</html>
