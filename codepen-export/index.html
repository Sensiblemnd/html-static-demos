","html":"<header>\n  <h1>Conditional Typography</h1>\n  <p>A heading scales within its component and switches to a compact treatment when space becomes tight.</p>\n</header>\n<div class=\"stage\">\n  <article><h1>Build interfaces that understand their space</h1><p>Resize the container to see the component adapt.</p></article>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 800px;\n  }\n}\n\n@layer components {\n  article {\n    padding: 2rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n  }\n\n  article h1 {\n    margin: 0;\n    font-size: clamp(1.4rem, 6cqi, 3.5rem);\n    line-height: 1;\n  }\n\n  article p {\n    color: var(--color-muted);\n  }\n\n  @container (width < 400px) {\n    article { padding: 1rem; }\n    article h1 { font-size: 1.6rem; }\n  }\n}","js":""},{"id":"css-lab/09-conditional-ui-density","lab":"css-lab","folder":"09-conditional-ui-density","title":"Conditional UI Density","html":"<header>\n  <h1>Conditional UI Density</h1>\n  <p>A data view removes secondary columns as its container gets smaller, preserving the most useful information.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"table\">\n    <div class=\"row head\"><b>Name</b><b>Status</b><b>Updated</b><b>Owner</b></div>\n    <div class=\"row\"><span>Project A</span><span>Active</span><span>2 min</span><span>Rob</span></div>\n    <div class=\"row\"><span>Project B</span><span>Pending</span><span>8 min</span><span>Sarah</span></div>\n    <div class=\"row\"><span>Project C</span><span>Active</span><span>12 min</span><span>Alex</span></div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 800px;\n    --stage-min: 260px;\n  }\n}\n\n@layer components {\n  .table {\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n  }\n\n  .row {\n    display: grid;\n    grid-template-columns: 2fr 1fr 1fr 1fr;\n    gap: 1rem;\n    padding-block: .8rem;\n    padding-inline: 1rem;\n    border-block-end: 1px solid var(--color-border);\n  }\n\n  .row.head {\n    background: var(--color-surface-2);\n  }\n\n  @container (width < 550px) {\n    .row { grid-template-columns: 2fr 1fr 1fr; }\n    .row > :nth-child(4) { display: none; }\n  }\n\n  @container (width < 400px) {\n    .row { grid-template-columns: 2fr 1fr; }\n    .row > :nth-child(3) { display: none; }\n  }\n}","js":""},{"id":"css-lab/10-overflow-pressure","lab":"css-lab","folder":"10-overflow-pressure","title":"Overflow Pressure","html":"<header>\n  <h1>Overflow Pressure</h1>\n  <p>Treat shrinking space as pressure: padding and the gaps between chips shrink continuously as the container narrows, down to a floor. No layout switch, just continuous scaling and the chips wrapping onto new lines as they run out of room.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"pressure\">\n    <b>Overflow pressure</b><div class=\"chips\"><span>React</span><span>CSS</span><span>TypeScript</span><span>Next.js</span></div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 700px;\n  }\n}\n\n@layer components {\n  .pressure {\n    padding: clamp(.75rem, 4cqi, 2rem);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: 1rem;\n  }\n\n  .chips {\n    display: flex;\n    flex-wrap: wrap;\n    gap: clamp(.25rem, 2cqi, 1rem);\n    margin-block-start: 1rem;\n  }\n\n  .chips span {\n    padding-block: .5rem;\n    padding-inline: .75rem;\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border: 1px solid transparent;\n    border-radius: 999px;\n    white-space: nowrap;\n  }\n}","js":""},{"id":"css-lab/11-edge-aware-card","lab":"css-lab","folder":"11-edge-aware-card","title":"Edge-Aware Component","html":"<header>\n  <h1>Edge-Aware Component</h1>\n  <p>A component changes its radius and shadow when its container becomes too narrow, creating a flush edge-to-edge treatment.</p>\n</header>\n<div class=\"stage\">\n  <article class=\"edge-card\"><b>Edge-aware UI</b><p>It adapts its visual treatment to available space.</p></article>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 700px;\n  }\n}\n\n@layer components {\n  .edge-card {\n    padding: 2rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: 1.25rem;\n    box-shadow: 0 1rem 2rem var(--shadow-color);\n  }\n\n  .edge-card p {\n    color: var(--color-muted);\n  }\n\n  @container (width < 400px) {\n    .edge-card { margin-inline: -1rem; border-inline: 0; border-radius: 0; box-shadow: none; }\n  }\n}","js":""},{"id":"css-lab/12-self-organizing-dashboard","lab":"css-lab","folder":"12-self-organizing-dashboard","title":"Self-Organizing Dashboard","html":"<header>\n  <h1>Self-Organizing Dashboard</h1>\n  <p>Cards use a minimum viable width so the grid reorganizes itself instead of relying on device-specific breakpoints.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"dashboard\">\n    <article>Revenue</article><article>Users</article><article>Alerts</article><article>Traffic</article><article>Tasks</article><article>Health</article>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 850px;\n  }\n}\n\n@layer components {\n  .dashboard {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));\n    gap: 1rem;\n  }\n\n  .dashboard article {\n    min-block-size: 8rem;\n    display: grid;\n    place-items: center;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: .75rem;\n  }\n}","js":""},{"id":"css-lab/13-css-constraint-programming","lab":"css-lab","folder":"13-css-constraint-programming","title":"Gradual Shrink, Sudden Stack","html":"<header>\n  <h1>Gradual Shrink, Sudden Stack</h1>\n  <p>Two independent rules watch the same box. The padding, the gap between cards, and how rounded their corners are all shrink smoothly the whole time you resize. Separately, once the container gets narrow enough, the three-column grid snaps to a single stacked column. Neither rule knows about the other, they just react to the same container.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"engine\">\n    <div class=\"rule\"><b>Constraint</b><span>Enough room?</span></div>\n    <div class=\"rule\"><b>Response</b><span>Resize me</span></div>\n    <div class=\"rule\"><b>Result</b><span>Layout adapts</span></div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 750px;\n  }\n}\n\n@layer components {\n  .engine {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: clamp(.5rem, 3cqi, 1.5rem);\n  }\n\n  .rule {\n    padding: clamp(.75rem, 4cqi, 2rem);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: clamp(.25rem, 2cqi, 1rem);\n  }\n\n  .rule b, .rule span {\n    display: block;\n  }\n\n  .rule span {\n    margin-block-start: .5rem;\n    color: var(--color-muted);\n  }\n\n  @container (width < 500px) {\n    .engine { grid-template-columns: 1fr; }\n  }\n}","js":""},{"id":"css-lab/14-zero-query-radius-snap","lab":"css-lab","folder":"14-zero-query-radius-snap","title":"Zero-Query Radius Snap","html":"<header>\n  <h1>Zero-Query Radius Snap</h1>\n  <p>A pure calc()/clamp() trick, not a container query: this card's radius snaps to 0 the instant it becomes edge-to-edge with the real browser viewport. Resize your actual browser window (not a dashed box) — watch it snap near 700px wide.</p>\n</header>\n<div class=\"bleed-card\">\n  <span>Full-bleed detector</span>\n  <strong>My radius reacts to real viewport width</strong>\n  <small>border-radius: clamp(0px, (100vw - 100%) * 9999, 1rem)</small>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .bleed-card {\n    inline-size: 100%;\n    max-inline-size: 700px;\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    box-shadow: 0 1rem 2rem var(--shadow-color);\n    /* 100% resolves to this element's own rendered width; when it's edge-to-edge with the\n       viewport, (100vw - 100%) is ~0, otherwise it's a large positive gap. *9999 amplifies\n       that gap so clamp() snaps straight to 0px or 1rem instead of a smooth blend; the 4px\n       fudge absorbs sub-pixel/scrollbar rounding right at the boundary */\n    border-radius: clamp(0px, (100vw - 4px - 100%) * 9999, 1rem);\n  }\n\n  .bleed-card span,\n  .bleed-card small {\n    display: block;\n    color: var(--color-muted);\n  }\n\n  .bleed-card strong {\n    display: block;\n    margin-block: .5rem;\n    font-size: 1.25rem;\n  }\n}","js":""},{"id":"css-lab/15-true-holy-albatross","lab":"css-lab","folder":"15-true-holy-albatross","title":"The Holy Albatross","html":"<header>\n  <h1>The Holy Albatross</h1>\n  <p>Heydon Pickering's original trick: three items sit in a row until space runs out, then flip straight to a fully stacked column — never the awkward two-plus-one orphan. The threshold lives in a flex-basis percentage multiplier, so no @container rule appears anywhere in this file.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"albatross\">\n    <div>Flight path</div>\n    <div>Cargo weight</div>\n    <div>Wind speed</div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 700px;\n  }\n}\n\n@layer components {\n  .albatross {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 1rem;\n    /* 100% here resolves against this flex container's own width, no @container needed;\n       negative above 34rem (row fits), positive below it (row doesn't fit) */\n    --multiplier: calc(34rem - 100%);\n  }\n\n  .albatross > div {\n    /* the three items' min-widths must leave room for the two 1rem gaps between them,\n       or the browser can't fit all three on one line and wraps the last one alone */\n    min-inline-size: calc((100% - 2rem) / 3);\n    max-inline-size: 100%;\n    flex-grow: 1;\n    /* *999 turns a small negative/positive multiplier into a huge one; flex-basis then gets\n       clamped by min/max-inline-size above, so items snap to ~33% (row) or 100% (stacked)\n       with nothing in between */\n    flex-basis: calc(var(--multiplier) * 999);\n    padding: 1.5rem;\n    display: grid;\n    place-items: center;\n    text-align: center;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: .75rem;\n  }\n}","js":""},{"id":"css-lab/16-container-scoped-albatross","lab":"css-lab","folder":"16-container-scoped-albatross","title":"Container-Scoped Albatross","html":"<header>\n  <h1>Container-Scoped Albatross</h1>\n  <p>A mashup of both articles: one calc()-derived switch, read from container query units, flips the layout, radius, and gap together — all from a single source of truth, with zero @container rules.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"panel\">\n    <div class=\"side\">Nav</div>\n    <div class=\"content\">Detail content reacts to the exact same switch as the sidebar and the radius.</div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 750px;\n  }\n}\n\n@layer components {\n  .panel {\n    --bp: 30rem;\n    /* same 0px/1px binary-snap trick as the other demos, but compared against 100cqi\n       (the container's own width) instead of 100vw, so it reacts to the .stage box, not the viewport */\n    --switch: clamp(0px, (var(--bp) - 100cqi) * 999, 1px);\n    /* strip the unit: 1 below the breakpoint (narrow/stacked), 0 above it (wide/side-by-side) */\n    --flip: calc(var(--switch) / 1px);\n    display: flex;\n    flex-wrap: wrap;\n    /* (1 - flip) inverts the switch: gap/radius are \"on\" only in the wide state */\n    gap: calc((1 - var(--flip)) * 1.5rem);\n    border-radius: calc((1 - var(--flip)) * 1rem);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    overflow: hidden;\n  }\n\n  .panel > .side,\n  .panel > .content {\n    flex-grow: 1;\n    /* flip=0 (wide): basis 0%, items sit side by side; flip=1 (narrow): basis 999%, each item\n       overflows the row on its own and wraps to full width, i.e. stacks */\n    flex-basis: calc(var(--flip) * 999%);\n    padding: 1.5rem;\n  }\n\n  .panel > .side {\n    background: var(--color-surface-2);\n  }\n}","js":""},{"id":"css-lab/17-chained-albatross","lab":"css-lab","folder":"17-chained-albatross","title":"Chained Albatross","html":"<header>\n  <h1>Chained Albatross</h1>\n  <p>Two calc() switches chained together: four cards move from a single row, to a 2-column grid, to a fully stacked column — three distinct states from pure math, no @container.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"chain\">\n    <div>1</div>\n    <div>2</div>\n    <div>3</div>\n    <div>4</div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 800px;\n  }\n}\n\n@layer components {\n  .chain {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 1rem;\n    --wide: 46rem;\n    --narrow: 26rem;\n    /* (container - wide) is negative below the threshold and positive above it;\n       *999 blows that up so clamp() saturates to exactly 0px or 1px, never in between */\n    --is-wide-px: clamp(0px, (100cqi - var(--wide)) * 999, 1px);\n    /* dividing a length by 1px strips the unit, turning the 0px/1px switch into a plain 0/1 number usable as a multiplier */\n    --is-wide: calc(var(--is-wide-px) / 1px);\n    /* mirror of --is-wide, comparing the container against the lower threshold instead */\n    --is-narrow-px: clamp(0px, (var(--narrow) - 100cqi) * 999, 1px);\n    --is-narrow: calc(var(--is-narrow-px) / 1px);\n    /* exactly one of is-wide/is-mid/is-narrow is ever 1 at a time, so this is \"neither of the other two\" */\n    --is-mid: calc(1 - var(--is-wide) - var(--is-narrow));\n  }\n\n  .chain > div {\n    flex-grow: 1;\n    /* only one term survives per state (the other two switches are 0), so this picks 20%, 45%, or 100% outright */\n    flex-basis: calc(var(--is-wide) * 20% + var(--is-mid) * 45% + var(--is-narrow) * 100%);\n    padding: 1.5rem;\n    display: grid;\n    place-items: center;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: .75rem;\n    font-size: 1.5rem;\n  }\n}","js":""},{"id":"css-lab/18-container-style-queries","lab":"css-lab","folder":"18-container-style-queries","title":"Container Style Queries","html":"<header>\n  <h1>Container Style Queries</h1>\n  <p>A container can query a custom property's value instead of its size — unlike every other demo here, this box isn't resizable. Click the toggle below instead: the badge reads the container's own --variant token via @container style(), no JavaScript involved. Baseline since May 2026, so it's the newest feature in this lab.</p>\n</header>\n<div class=\"stage\">\n  <input type=\"checkbox\" id=\"variant-toggle\" class=\"toggle-input\">\n  <label for=\"variant-toggle\" class=\"toggle-label\">Accent variant</label>\n  <div class=\"panel\">\n    <span class=\"badge\">Status</span>\n    <p>This badge's shape and color come entirely from the container's --variant custom property, matched by @container style(--variant: accent).</p>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 650px;\n    /* this demo reacts to a custom-property VALUE, not the container's size — the drag\n       handle every other demo relies on would be a dead, misleading affordance here */\n    resize: none;\n  }\n}\n\n@layer components {\n  .toggle-input {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n  }\n\n  .toggle-label {\n    display: inline-flex;\n    align-items: center;\n    gap: .5rem;\n    margin-block-end: 1rem;\n    padding-block: .5rem;\n    padding-inline: .9rem;\n    border-radius: 999px;\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    cursor: pointer;\n    user-select: none;\n  }\n\n  .toggle-label::before {\n    content: \"\";\n    inline-size: .9rem;\n    block-size: .9rem;\n    border-radius: 50%;\n    background: var(--color-border);\n  }\n\n  .toggle-input:checked ~ .toggle-label::before {\n    background: var(--color-accent);\n  }\n\n  /* the real checkbox is visually hidden, so its focus ring has to be forwarded to the label */\n  .toggle-input:focus-visible ~ .toggle-label {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  .panel {\n    /* container-type isn't required for style queries (only size queries need containment) —\n       set explicitly anyway so the query container is unambiguous */\n    container-type: normal;\n    container-name: panel;\n    --variant: default;\n    padding: 2rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: 1rem;\n  }\n\n  .toggle-input:checked ~ .panel {\n    --variant: accent;\n  }\n\n  .badge {\n    display: inline-block;\n    padding-block: .35rem;\n    padding-inline: .75rem;\n    border-radius: .35rem;\n    background: var(--color-surface-2);\n    border: 1px solid transparent;\n    font-size: .85rem;\n  }\n\n  .panel p {\n    color: var(--color-muted);\n    margin-block-start: 1rem;\n  }\n\n  /* queries the container's --variant VALUE, not its width — a completely different axis\n     from every @container rule elsewhere in this lab */\n  @container panel style(--variant: accent) {\n    .badge {\n      background: var(--color-accent);\n      color: var(--color-bg);\n      border-radius: 999px;\n    }\n  }\n}","js":""},{"id":"css-lab/19-shape-aware-container","lab":"css-lab","folder":"19-shape-aware-container","title":"Shape-Aware Container","html":"<header>\n  <h1>Shape-Aware Container</h1>\n  <p>This card doesn't just react to width — it reacts to its own aspect ratio. Drag the stage's corner (not just its edge) to reshape it from landscape to portrait and watch the internal layout rotate via @container (aspect-ratio &lt; 1).</p>\n</header>\n<div class=\"stage\">\n  <div class=\"shape-card\">\n    <div class=\"art\" aria-hidden=\"true\"></div>\n    <div class=\"copy\">\n      <strong>Aspect-aware layout</strong>\n      <p>Landscape containers get a side-by-side layout; portrait containers stack.</p>\n    </div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 700px;\n    /* both axes need to be draggable so the container's aspect-ratio can actually change */\n    resize: both;\n    /* aspect-ratio queries need both axes contained, unlike every other demo's inline-size-only container */\n    container-type: size;\n    block-size: min(60vh, 420px);\n    min-block-size: 160px;\n  }\n}\n\n@layer components {\n  .shape-card {\n    display: flex;\n    flex-direction: row;\n    gap: 1rem;\n    block-size: 100%;\n    padding: 1.5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: 1rem;\n    overflow: hidden;\n  }\n\n  .art {\n    flex: 1 1 40%;\n    border-radius: .75rem;\n    background: linear-gradient(135deg, var(--color-accent), var(--color-surface-2));\n  }\n\n  .copy {\n    flex: 1 1 60%;\n    display: grid;\n    align-content: center;\n    gap: .5rem;\n  }\n\n  .copy p {\n    color: var(--color-muted);\n  }\n\n  @container (aspect-ratio < 1) {\n    .shape-card { flex-direction: column; }\n    .art { flex-basis: 40%; }\n  }\n}","js":""},{"id":"css-lab/20-animatable-constraint-switch","lab":"css-lab","folder":"20-animatable-constraint-switch","title":"Animatable Constraint Switch","html":"<header>\n  <h1>Animatable Constraint Switch</h1>\n  <p>Same binary switch as Container-Scoped Albatross, but this time --flip is registered with @property as a real &lt;number&gt;. That makes it animatable — instead of jumping instantly at the threshold, the layout eases smoothly across it.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"panel\">\n    <div class=\"side\">Nav</div>\n    <div class=\"content\">Same formula as demo 16 — registering --flip via @property is what makes this one glide instead of snap.</div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer tokens {\n  @property --flip {\n    syntax: \"<number>\";\n    /* children below read the parent's --flip in their own flex-basis calc(), so it must inherit */\n    inherits: true;\n    initial-value: 0;\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 750px;\n  }\n}\n\n@layer components {\n  .panel {\n    --bp: 30rem;\n    --switch: clamp(0px, (var(--bp) - 100cqi) * 999, 1px);\n    /* identical formula to demo 16's --flip, but because it's registered as a typed <number>\n       above, the browser can interpolate it — an unregistered custom property can only ever\n       jump discretely, which is why demo 16's version snaps instead of easing */\n    --flip: calc(var(--switch) / 1px);\n    display: flex;\n    flex-wrap: wrap;\n    gap: calc((1 - var(--flip)) * 1.5rem);\n    border-radius: calc((1 - var(--flip)) * 1rem);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    overflow: hidden;\n  }\n\n  @media (prefers-reduced-motion: no-preference) {\n    .panel {\n      /* transitioning the custom property itself is enough: every calc() that reads\n         var(--flip) below, including the children's flex-basis, recomputes every frame as\n         this one value eases from 0 to 1 */\n      transition: --flip .35s ease;\n    }\n  }\n\n  .panel > .side,\n  .panel > .content {\n    flex-grow: 1;\n    flex-basis: calc(var(--flip) * 999%);\n    padding: 1.5rem;\n  }\n\n  .panel > .side {\n    background: var(--color-surface-2);\n  }\n}","js":""},{"id":"css-lab/21-integer-grid-steps","lab":"css-lab","folder":"21-integer-grid-steps","title":"Integer Grid Steps","html":"<header>\n  <h1>Integer Grid Steps</h1>\n  <p>round() computes exactly how many fixed-width columns fit in the container and floors it to a whole number — a literal constraint solve, not auto-fit's implicit column-collapsing magic.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"grid\">\n    <div>1</div>\n    <div>2</div>\n    <div>3</div>\n    <div>4</div>\n    <div>5</div>\n    <div>6</div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 800px;\n  }\n}\n\n@layer components {\n  .grid {\n    --col-min: 9rem;\n    --gap: 1rem;\n    /* how many --col-min-wide columns (plus one gap each) fit across the container's own width */\n    --raw-count: calc((100cqi + var(--gap)) / (var(--col-min) + var(--gap)));\n    /* floor to a whole number of columns, never fewer than 1 */\n    --col-count: max(1, round(down, var(--raw-count), 1));\n    display: grid;\n    grid-template-columns: repeat(var(--col-count), 1fr);\n    gap: var(--gap);\n  }\n\n  .grid div {\n    min-block-size: 5rem;\n    display: grid;\n    place-items: center;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: .75rem;\n    font-size: 1.25rem;\n  }\n}","js":""},{"id":"css-lab/22-aspect-ratio-gallery","lab":"css-lab","folder":"22-aspect-ratio-gallery","title":"Aspect-Ratio Gallery","html":"<header>\n  <h1>Aspect-Ratio Gallery</h1>\n  <p>Four containers, four ways to react to shape instead of width. Each stage below resizes independently &mdash; drag its corner and watch what triggers: a compound range, the <code>orientation</code> keyword, the older prefixed <code>min-aspect-ratio</code> syntax, and a single-sided range.</p>\n</header>\n\n<section>\n  <div class=\"stage-heading\">\n    <h2>1. Tri-state card</h2>\n    <p>Wide gets a side-by-side layout, square gets a centered circular avatar, tall stacks a full-width image on top. The square band uses a compound query: <code>(aspect-ratio &gt; 4/5) and (aspect-ratio &lt; 5/4)</code>.</p>\n  </div>\n  <div class=\"shape-stage\" style=\"--stage-max: 480px; --stage-block: 260px;\">\n    <div class=\"tri-card\">\n      <div class=\"art\" aria-hidden=\"true\"></div>\n      <div class=\"copy\">\n        <strong>Shape-driven card</strong>\n        <p>Layout rotates through three distinct states, not just two.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"stage-heading\">\n    <h2>2. Icon cluster</h2>\n    <p>Reflows to a column in a portrait container using the <code>orientation</code> keyword &mdash; the readable alternative to writing out <code>aspect-ratio &lt; 1</code>.</p>\n  </div>\n  <div class=\"shape-stage\" style=\"--stage-max: 360px; --stage-block: 220px;\">\n    <div class=\"icon-cluster\">\n      <span class=\"chip\">A</span>\n      <span class=\"chip\">B</span>\n      <span class=\"chip\">C</span>\n      <span class=\"chip\">D</span>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"stage-heading\">\n    <h2>3. Stat panel</h2>\n    <p>The sparkline only appears once the container is wide enough relative to its height to actually be legible, via the prefixed <code>(min-aspect-ratio: 3/2)</code> syntax.</p>\n  </div>\n  <div class=\"shape-stage\" style=\"--stage-max: 420px; --stage-block: 200px;\">\n    <div class=\"stat-panel\">\n      <span class=\"headline\">4,812</span>\n      <svg class=\"sparkline\" viewBox=\"0 0 100 30\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <path d=\"M0 25 L15 18 L30 20 L45 8 L60 14 L75 5 L90 10 L100 2\" />\n      </svg>\n    </div>\n  </div>\n</section>\n\n<section>\n  <div class=\"stage-heading\">\n    <h2>4. Media block</h2>\n    <p>The caption overlays the art in wide containers, but drops to a plain block below it once the shape is too narrow to overlay without obscuring everything: <code>(aspect-ratio &gt;= 4/3)</code>.</p>\n  </div>\n  <div class=\"shape-stage\" style=\"--stage-max: 460px; --stage-block: 240px;\">\n    <div class=\"media-block\">\n      <p class=\"caption\">Editorial-style caption placement, driven entirely by container shape.</p>\n    </div>\n  </div>\n</section>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .shape-stage {\n    /* aspect-ratio and orientation queries need both axes contained, unlike the inline-size-only .stage every non-shape demo uses */\n    container-type: size;\n    resize: both;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 480px));\n    min-inline-size: var(--stage-min, 160px);\n    block-size: var(--stage-block, 280px);\n    min-block-size: 140px;\n    margin-block: 1.5rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-heading {\n    max-inline-size: 480px;\n    margin-inline: auto;\n    margin-block: 2.5rem 0;\n  }\n\n  .stage-heading h2 {\n    margin-block-end: .25rem;\n    font-size: 1.05rem;\n  }\n\n  .stage-heading p {\n    margin-block: 0;\n    color: var(--color-muted);\n    font-size: .875rem;\n  }\n}\n\n@layer components {\n  /* ---------- 1. tri-state card: wide / square / tall get three genuinely different layouts ---------- */\n  .tri-card {\n    display: flex;\n    flex-direction: row;\n    align-items: center;\n    gap: 1rem;\n    block-size: 100%;\n    padding: 1.25rem;\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-radius: 1rem;\n    overflow: hidden;\n  }\n\n  .tri-card .art {\n    flex: 0 0 40%;\n    block-size: 100%;\n    border-radius: .75rem;\n    background: linear-gradient(135deg, var(--color-accent), var(--color-surface-2));\n  }\n\n  .tri-card .copy {\n    display: grid;\n    gap: .35rem;\n  }\n\n  .tri-card .copy p {\n    margin: 0;\n    color: var(--color-muted);\n  }\n\n  /* the square band isn't reachable by the other two rules, so it needs its own two-sided range */\n  @container (aspect-ratio > 4/5) and (aspect-ratio < 5/4) {\n    .tri-card {\n      flex-direction: column;\n      text-align: center;\n    }\n\n    .tri-card .art {\n      flex-basis: auto;\n      inline-size: 4rem;\n      block-size: 4rem;\n      border-radius: 50%;\n    }\n  }\n\n  @container (aspect-ratio <= 4/5) {\n    .tri-card {\n      flex-direction: column;\n    }\n\n    .tri-card .art {\n      flex: 0 0 45%;\n      inline-size: 100%;\n    }\n  }\n\n  /* ---------- 2. icon cluster: orientation keyword instead of a numeric comparison ---------- */\n  .icon-cluster {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    justify-content: center;\n    gap: .75rem;\n    block-size: 100%;\n    padding: 1.25rem;\n  }\n\n  .icon-cluster .chip {\n    display: grid;\n    place-items: center;\n    inline-size: 2.75rem;\n    block-size: 2.75rem;\n    border-radius: 50%;\n    background: var(--color-surface-2);\n    border: 1px solid var(--color-border);\n    font-size: .8rem;\n  }\n\n  @container (orientation: portrait) {\n    .icon-cluster {\n      flex-direction: column;\n    }\n  }\n\n  /* ---------- 3. stat panel: the sparkline is decorative and unreadable below a certain width, so its visibility is a shape decision, not a breakpoint ---------- */\n  .stat-panel {\n    display: grid;\n    align-content: center;\n    gap: .5rem;\n    block-size: 100%;\n    padding: 1.25rem;\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-radius: 1rem;\n  }\n\n  .stat-panel .headline {\n    font-size: 2rem;\n    font-weight: 600;\n  }\n\n  .stat-panel .sparkline {\n    display: none;\n    inline-size: 100%;\n    block-size: 2.5rem;\n  }\n\n  .stat-panel .sparkline path {\n    fill: none;\n    stroke: var(--color-accent);\n    stroke-width: 2;\n  }\n\n  /* min-aspect-ratio is the older prefixed media-feature syntax, still valid — equivalent to (aspect-ratio >= 3/2) used elsewhere in this file */\n  @container (min-aspect-ratio: 3/2) {\n    .stat-panel .sparkline {\n      display: block;\n    }\n  }\n\n  /* ---------- 4. media block: caption overlays the art only when there's enough width that it won't obscure it ---------- */\n  .media-block {\n    position: relative;\n    block-size: 100%;\n    overflow: hidden;\n    border-radius: 1rem;\n    background: linear-gradient(160deg, var(--color-surface-2), var(--color-surface));\n  }\n\n  .media-block .caption {\n    margin: 0;\n    padding: 1rem;\n    color: var(--color-muted);\n  }\n\n  @container (aspect-ratio >= 4/3) {\n    .media-block .caption {\n      position: absolute;\n      inset-block-end: 0;\n      inset-inline: 0;\n      color: var(--color-text);\n      background: linear-gradient(transparent, rgb(0 0 0 / 70%));\n    }\n  }\n}","js":""},{"id":"css-lab/23-shape-morphing-child","lab":"css-lab","folder":"23-shape-morphing-child","title":"Shape-Morphing Child","html":"<header>\n  <h1>Shape-Morphing Child</h1>\n  <p>One element, no JavaScript: its own geometry is driven entirely by its container's aspect ratio. Drag the stage's corner: near a 1:1 ratio it rounds into a circle, the middle bands settle as a square, and past a 3:5 or 5:3 ratio it stretches into a rectangle.</p>\n</header>\n<div class=\"shape-stage\" style=\"--stage-max: 460px; --stage-block: 300px;\">\n  <div class=\"morph-wrap\">\n    <div class=\"morph-shape\" aria-hidden=\"true\"></div>\n    <p class=\"morph-label\" aria-hidden=\"true\"></p>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .shape-stage {\n    /* aspect-ratio queries need both axes contained */\n    container-type: size;\n    container-name: morph;\n    resize: both;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 460px));\n    min-inline-size: var(--stage-min, 140px);\n    block-size: var(--stage-block, 300px);\n    min-block-size: 120px;\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .morph-wrap {\n    display: grid;\n    justify-items: center;\n    align-content: center;\n    gap: .75rem;\n    block-size: 100%;\n  }\n\n  .morph-shape {\n    /* cqmin ties the shape to whichever axis is smaller, so a square/circle never overflows as the container reshapes */\n    inline-size: 50cqmin;\n    block-size: 50cqmin;\n    border-radius: 12%;\n    background: linear-gradient(135deg, var(--color-accent), var(--color-surface-2));\n    transition: inline-size .3s ease, block-size .3s ease, border-radius .3s ease;\n  }\n\n  .morph-label {\n    margin: 0;\n    font-size: .8rem;\n    color: var(--color-muted);\n  }\n\n  /* square is the fallback identity: only the near-1:1 and far-from-1:1 bands get explicit\n     overrides below, so every ratio in between falls through to this rule for free instead of\n     needing its own explicit range */\n  .morph-label::after {\n    content: \"Square\";\n  }\n\n  /* every boundary below comes from one base ratio, 5/3 (≈1.6667), the \"how far from square\n     counts as a rectangle\" threshold. The rectangle bands are that ratio and its reciprocal\n     (3/5). The circle band is its fourth root, sqrt(sqrt(5/3)) ≈ 1.1362, and that root's\n     reciprocal ≈ .8801, so one number determines all four edges instead of two unrelated\n     magic-fraction pairs. @container conditions can't reference custom properties or calc()\n     (verified: both are silently ignored), so the derived decimals are hardcoded rather than\n     computed live from a single variable. */\n  @container morph (aspect-ratio > .8801) and (aspect-ratio < 1.1362) {\n    .morph-shape {\n      border-radius: 50%;\n    }\n\n    .morph-label::after {\n      content: \"Circle\";\n    }\n  }\n\n  @container morph (aspect-ratio <= 3/5) {\n    .morph-shape {\n      inline-size: 30cqmin;\n      block-size: 70cqh;\n      border-radius: 15%;\n    }\n\n    .morph-label::after {\n      content: \"Rectangle\";\n    }\n  }\n\n  @container morph (aspect-ratio >= 5/3) {\n    .morph-shape {\n      inline-size: 70cqw;\n      block-size: 30cqmin;\n      border-radius: 15%;\n    }\n\n    .morph-label::after {\n      content: \"Rectangle\";\n    }\n  }\n}","js":""},{"id":"css-lab2/01-typography-scale","lab":"css-lab2","folder":"01-typography-scale","title":"Typography Scale","html":"<header>\n  <h1>Typography Scale</h1>\n  <p>The slider's thumb has a <code>view-timeline</code>; a registered <code>@property --_f</code> is bound to that timeline. Dragging the thumb scrubs <code>--_f</code> from 0 to 1 live, and font size, line height, and letter spacing all interpolate from that single number. Zero JavaScript.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"stage-control\">\n    <label for=\"scale\">Scale</label>\n    <input type=\"range\" id=\"scale\" class=\"range-slider\" value=\"0\">\n  </div>\n  <div class=\"type-preview\">\n    <h2>The quick brown fox</h2>\n    <p>jumps over the lazy dog. Drag the slider and watch the heading scale, loosen its line height, and open up its letter-spacing all at once.</p>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@property --_f {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n\n@layer overrides {\n  :root {\n    timeline-scope: --_f;\n    animation: --_f linear both;\n    animation-timeline: --_f;\n    animation-range: entry 100% exit 0%;\n  }\n\n  @keyframes --_f {\n    0% { --_f: 1; }\n  }\n\n  .range-slider::-webkit-slider-thumb {\n    view-timeline: --_f inline;\n  }\n\n  .range-slider::-moz-range-thumb {\n    view-timeline: --_f inline;\n  }\n}\n\n@layer components {\n  .type-preview {\n    --font-size-min: 1rem;\n    --font-size-max: 3.5rem;\n    --leading-min: 1.2;\n    --leading-max: 1.6;\n    --tracking-min: -0.01em;\n    --tracking-max: 0.08em;\n  }\n\n  .type-preview h2 {\n    margin: 0 0 .75rem;\n    font-size: calc(var(--font-size-max) * var(--_f) + var(--font-size-min) * (1 - var(--_f)));\n    line-height: calc(var(--leading-max) * var(--_f) + var(--leading-min) * (1 - var(--_f)));\n    letter-spacing: calc(var(--tracking-max) * var(--_f) + var(--tracking-min) * (1 - var(--_f)));\n  }\n\n  .type-preview p {\n    max-inline-size: 60ch;\n    color: var(--color-muted);\n  }\n}","js":""},{"id":"css-lab2/02-color-channel-mixer","lab":"css-lab2","folder":"02-color-channel-mixer","title":"Color Channel Mixer","html":"<header>\n  <h1>Color Channel Mixer</h1>\n  <p>Three sliders, three independent registered properties (<code>--_r</code>, <code>--_g</code>, <code>--_b</code>), each with its own <code>view-timeline</code> on its own thumb. The swatch below is a plain <code>rgb()</code> built from all three — a from-scratch color picker with no JavaScript.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"stage-controls\">\n    <div class=\"stage-control\">\n      <label for=\"r\">Red</label>\n      <input type=\"range\" id=\"r\" class=\"range-slider range-slider--r\" value=\"0\">\n    </div>\n    <div class=\"stage-control\">\n      <label for=\"g\">Green</label>\n      <input type=\"range\" id=\"g\" class=\"range-slider range-slider--g\" value=\"0\">\n    </div>\n    <div class=\"stage-control\">\n      <label for=\"b\">Blue</label>\n      <input type=\"range\" id=\"b\" class=\"range-slider range-slider--b\" value=\"0\">\n    </div>\n  </div>\n  <div class=\"swatch\"></div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --color-channel-r: #ef4444;\n    --color-channel-g: #22c55e;\n    --color-channel-b: #3b82f6;\n  }\n}\n\n@property --_r {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n@property --_g {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n@property --_b {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n\n@layer overrides {\n  :root {\n    timeline-scope: --_r, --_g, --_b;\n    animation:\n      --_r linear both,\n      --_g linear both,\n      --_b linear both;\n    animation-timeline: --_r, --_g, --_b;\n    animation-range: entry 100% exit 0%;\n  }\n\n  @keyframes --_r { 0% { --_r: 1; } }\n  @keyframes --_g { 0% { --_g: 1; } }\n  @keyframes --_b { 0% { --_b: 1; } }\n\n  .range-slider--r::-webkit-slider-thumb {\n    view-timeline: --_r inline;\n    background: var(--color-channel-r);\n    box-shadow: 0 0 0 1px var(--color-channel-r);\n  }\n  .range-slider--g::-webkit-slider-thumb {\n    view-timeline: --_g inline;\n    background: var(--color-channel-g);\n    box-shadow: 0 0 0 1px var(--color-channel-g);\n  }\n  .range-slider--b::-webkit-slider-thumb {\n    view-timeline: --_b inline;\n    background: var(--color-channel-b);\n    box-shadow: 0 0 0 1px var(--color-channel-b);\n  }\n\n  .range-slider--r::-moz-range-thumb {\n    view-timeline: --_r inline;\n    background: var(--color-channel-r);\n    box-shadow: 0 0 0 1px var(--color-channel-r);\n  }\n  .range-slider--g::-moz-range-thumb {\n    view-timeline: --_g inline;\n    background: var(--color-channel-g);\n    box-shadow: 0 0 0 1px var(--color-channel-g);\n  }\n  .range-slider--b::-moz-range-thumb {\n    view-timeline: --_b inline;\n    background: var(--color-channel-b);\n    box-shadow: 0 0 0 1px var(--color-channel-b);\n  }\n}\n\n@layer components {\n  .swatch {\n    inline-size: 100%;\n    block-size: 8rem;\n    border-radius: .75rem;\n    border: 1px solid var(--color-border);\n    background: rgb(\n      calc(var(--_r) * 255)\n      calc(var(--_g) * 255)\n      calc(var(--_b) * 255)\n    );\n  }\n}","js":""},{"id":"css-lab2/03-duotone-filter","lab":"css-lab2","folder":"03-duotone-filter","title":"Duotone Filter Slider","html":"<header>\n  <h1>Duotone Filter Slider</h1>\n  <p>A single slider-linked <code>--_f</code> drives a stack of <code>filter()</code> functions — <code>grayscale()</code>, <code>sepia()</code>, <code>hue-rotate()</code>, <code>saturate()</code> — live over a CSS gradient \"photo\". An Instagram-style intensity control with no JavaScript and no image asset.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"stage-control\">\n    <label for=\"intensity\">Filter intensity</label>\n    <input type=\"range\" id=\"intensity\" class=\"range-slider\" value=\"0\">\n  </div>\n  <div class=\"photo\"></div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-ra
