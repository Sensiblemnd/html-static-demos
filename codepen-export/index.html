    font-size: 1.1rem;\n    line-height: 1;\n    align-items: center;\n    justify-content: center;\n    border-radius: 0.35rem;\n    background: transparent;\n    color: var(--color-text);\n    cursor: pointer;\n    :hover {\n      background: var(--color-surface-2);\n    }\n  }\n\n  @container (width < 650px) {\n    .overflow-item--tier1 {\n      display: none;\n    }\n    .more {\n      display: inline-flex;\n    }\n  }\n\n  @container (width < 450px) {\n    .overflow-item--tier2 {\n      display: none;\n    }\n  }\n\n  .nav-menu {\n    position: fixed;\n  \n    top: anchor(--nav-trigger bottom);\n    right: anchor(--nav-trigger right);\n    bottom: auto;\n    left: auto;\n    margin-block-start: 0.5rem;\n    padding: 0.4rem;\n    display: grid;\n    gap: 0.1rem;\n    list-style: none;\n    min-inline-size: 10rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: 0.6rem;\n    box-shadow: 0 1rem 2rem var(--shadow-color);\n    opacity: 0;\n    translate: 0 -0.25rem;\n\n    @media (prefers-reduced-motion: no-preference) {\n      transition:\n        opacity 0.15s ease,\n        translate 0.15s ease,\n        display 0.15s allow-discrete;\n    }\n  }\n\n  .nav-menu:popover-open {\n    opacity: 1;\n    translate: 0 0;\n\n    @starting-style {\n      opacity: 0;\n      translate: 0 -0.25rem;\n    }\n  }\n\n  .nav-menu li {\n    margin: 0;\n  }\n  .menu-item--tier1,\n  .menu-item--tier2 {\n    display: none;\n  }\n\n  @container (width < 650px) {\n    .menu-item--tier1 {\n      display: block;\n    }\n  }\n\n  @container (width < 450px) {\n    .menu-item--tier2 {\n      display: block;\n    }\n  }\n\n  .nav-menu {\n    a,\n    button {\n      display: block;\n      inline-size: 100%;\n      padding-block: 0.5rem;\n      padding-inline: 0.6rem;\n      border-radius: 0.4rem;\n      text-align: start;\n      text-decoration: none;\n      color: inherit;\n      background: transparent;\n      border: 0;\n      cursor: pointer;\n    }\n\n    a:hover,\n    button:hover {\n      background: var(--color-surface-2);\n    }\n  }\n}","js":""},{"id":"css-lab/06-breakpointless-navigation-v2","lab":"css-lab","folder":"06-breakpointless-navigation-v2","title":"Breakpointless Navigation v2","html":"<header>\n  <h1>Breakpointless Navigation, Counted</h1>\n  <p>Same popover menu as v1, but nothing is tagged with a tier class. Which items hide is decided purely by position: a plain wrapper + :nth-last-child() does the hiding, no tier1/tier2 markers anywhere.</p>\n</header>\n<div class=\"stage\">\n  <nav class=\"nav\">\n    <b>Brand</b>\n    <a>Home</a>\n    <div class=\"nav-items\">\n      <a>Products</a>\n      <a>Pricing</a>\n      <button>Sign in</button>\n      <a>About</a>\n      <a>Contact</a>\n    </div>\n    <button popovertarget=\"nav-menu\" class=\"more\" aria-label=\"More links\">&#9776;</button>\n  </nav>\n  <ul id=\"nav-menu\" popover class=\"nav-menu\">\n    <li><a>Products</a></li>\n    <li><a>Pricing</a></li>\n    <li><button>Sign in</button></li>\n    <li><a>About</a></li>\n    <li><a>Contact</a></li>\n  </ul>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    container-type: inline-size;\n    /* physical: the drag handle a browser paints for `resize` always sits at the\n       physical bottom-right corner regardless of writing mode */\n    resize: horizontal;\n    overflow: auto;\n    inline-size: min(90vw, var(--stage-max, 700px));\n    min-inline-size: var(--stage-min, 220px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 1rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer layout {\n  .stage {\n    --stage-max: 850px;\n    --stage-min: 260px;\n  }\n}\n\n@layer components {\n  .nav {\n    display: flex;\n    align-items: center;\n    gap: 1rem;\n    min-inline-size: max-content;\n    padding: 1rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n\n    b {\n      margin-inline-end: auto;\n    }\n\n    button {\n      border: 0;\n      padding-block: .5rem;\n      padding-inline: .75rem;\n    }\n  }\n\n  /* collapses out of the box tree so .nav's own gap applies uniformly across every item\n     and the hamburger, with no double-gap from wrapping the countable items in their own\n     flex container; :nth-last-child() below still counts its real DOM children, since\n     display:contents only changes rendering, not DOM structure */\n  .nav-items {\n    display: contents;\n  }\n\n  :is(.nav a, .nav button, .nav-menu a, .nav-menu button) {\n    white-space: nowrap;\n  }\n\n  .more {\n    /* the popover opens into the top layer, which position:absolute can't reach back from\n       to find .nav as its containing block — anchor-name + anchor() bridges that gap */\n    anchor-name: --nav-trigger;\n    display: none;\n    font-size: 1.1rem;\n    line-height: 1;\n    align-items: center;\n    justify-content: center;\n    border-radius: .35rem;\n    background: transparent;\n    color: var(--color-text);\n    cursor: pointer;\n\n    &:hover {\n      background: var(--color-surface-2);\n    }\n  }\n\n  /* --- item collapse: position decides visibility, not a per-item tier class --- */\n\n  @container (width < 650px) {\n    .nav-items > :nth-last-child(-n + 2) {\n      display: none;\n    }\n    .more {\n      display: inline-flex;\n    }\n  }\n\n  @container (width < 450px) {\n    .nav-items > :nth-last-child(-n + 5) {\n      display: none;\n    }\n  }\n\n  /* --- overflow menu: a native popover, so open/close/outside-click/Escape are all free --- */\n\n  .nav-menu {\n    position: fixed;\n    /* named explicitly here (anchor(--nav-trigger side)) rather than via the position-anchor\n       property, since position-anchor itself has meaningfully weaker support than the core\n       anchor-name/anchor() mechanism this depends on */\n    top: anchor(--nav-trigger bottom);\n    right: anchor(--nav-trigger right);\n    /* the UA stylesheet sets all four [popover] insets to 0 by default; left/bottom have to\n       be reset to auto or this box stays over-constrained and the anchor() values above lose */\n    bottom: auto;\n    left: auto;\n    margin-block-start: .5rem;\n    padding: .4rem;\n    display: grid;\n    gap: .1rem;\n    list-style: none;\n    min-inline-size: 10rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: .6rem;\n    box-shadow: 0 1rem 2rem var(--shadow-color);\n    opacity: 0;\n    translate: 0 -.25rem;\n\n    @media (prefers-reduced-motion: no-preference) {\n      transition: opacity .15s ease, translate .15s ease, display .15s allow-discrete;\n    }\n\n    &:popover-open {\n      opacity: 1;\n      translate: 0 0;\n\n      @starting-style {\n        opacity: 0;\n        translate: 0 -.25rem;\n      }\n    }\n\n    li {\n      display: none;\n      margin: 0;\n    }\n\n    /* mirrors the same position-based logic as the inline row above: a menu item only\n       appears once its inline twin has actually been hidden by the row's own breakpoints */\n    @container (width < 650px) {\n      > :nth-last-child(-n + 2) {\n        display: block;\n      }\n    }\n\n    @container (width < 450px) {\n      > :nth-last-child(-n + 5) {\n        display: block;\n      }\n    }\n\n    a,\n    button {\n      display: block;\n      inline-size: 100%;\n      padding-block: .5rem;\n      padding-inline: .6rem;\n      border-radius: .4rem;\n      text-align: start;\n      text-decoration: none;\n      color: inherit;\n      background: transparent;\n      border: 0;\n      cursor: pointer;\n    }\n\n    a:hover,\n    button:hover {\n      background: var(--color-surface-2);\n    }\n  }\n}","js":""},{"id":"css-lab/07-no-orphan-layout","lab":"css-lab","folder":"07-no-orphan-layout","title":"No-Orphan Layout","html":"<header>\n  <h1>No-Orphan Layout</h1>\n  <p>Flex items wrap around their minimum viable width, avoiding tiny orphaned columns.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"items\"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div></div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer rese
