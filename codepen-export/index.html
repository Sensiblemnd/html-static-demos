es {\n  :root {\n    timeline-scope: --_f;\n    animation: --_f linear both;\n    animation-timeline: --_f;\n    animation-range: entry 100% exit 0%;\n  }\n\n  @keyframes --_f {\n    0% { --_f: 1; }\n  }\n\n  .range-slider::-webkit-slider-thumb {\n    view-timeline: --_f inline;\n  }\n\n  .range-slider::-moz-range-thumb {\n    view-timeline: --_f inline;\n  }\n}\n\n@layer components {\n  .dial {\n    position: relative;\n    inline-size: 14rem;\n    block-size: 14rem;\n    margin-inline: auto;\n  }\n\n  .dial-wheel {\n    position: absolute;\n    inset: 0;\n    border-radius: 50%;\n    border: 1px solid var(--color-border);\n    background: conic-gradient(\n      from calc(var(--_f) * 360deg),\n      #ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444\n    );\n  }\n\n  .dial-pointer {\n    position: absolute;\n    inset-block-start: 50%;\n    inset-inline-start: 50%;\n    inline-size: 45%;\n    block-size: 4px;\n    background: var(--color-text);\n    border-radius: 2px;\n    transform-origin: left center;\n    transform: translateY(-50%) rotate(calc(var(--_f) * 360deg));\n  }\n}","js":""},{"id":"css-lab2/07-equalizer-bars","lab":"css-lab2","folder":"07-equalizer-bars","title":"Equalizer Bars","html":"<header>\n  <h1>Equalizer Bars</h1>\n  <p>Six sliders, six independent registered properties, six separate view-timelines — one per thumb. Each bar's height reads straight from its own slider's live value, showing the technique scales to many simultaneous inputs on one page.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"eq\">\n    <div class=\"eq-band\">\n      <input type=\"range\" class=\"range-slider range-slider--f1\" value=\"30\" aria-label=\"Band 1\">\n      <div class=\"eq-bar eq-bar--1\"></div>\n    </div>\n    <div class=\"eq-band\">\n      <input type=\"range\" class=\"range-slider range-slider--f2\" value=\"55\" aria-label=\"Band 2\">\n      <div class=\"eq-bar eq-bar--2\"></div>\n    </div>\n    <div class=\"eq-band\">\n      <inp  { view-timeline: --_f4 inline; }\n  .range-slider--f5::-webkit-slider-thumb { view-timeline: --_f5 inline; }\n  .range-slider--f6::-webkit-slider-thumb { view-timeline: --_f6 inline; }\n\n  .range-slider--f1::-moz-range-thumb { view-timeline: --_f1 inline; }\n  .range-slider--f2::-moz-range-thumb { view-timeline: --_f2 inline; }\n  .range-slider--f3::-moz-range-thumb { view-timeline: --_f3 inline; }\n  .range-slider--f4::-moz-range-thumb { view-timeline: --_f4 inline; }\n  .range-slider--f5::-moz-range-thumb { view-timeline: --_f5 inline; }\n  .range-slider--f6::-moz-range-thumb { view-timeline: --_f6 inline; }\n}\n\n@layer components {\n  .eq {\n    display: flex;\n    align-items: end;\n    gap: 1rem;\n    block-size: 14rem;\n  }\n\n  .eq-band {\n    flex: 1;\n    display: flex;\n    flex-direction: column-reverse;\n    align-items: stretch;\n    gap: .75rem;\n    block-size: 100%;\n  }\n\n  .eq-bar {\n    inline-size: 100%;\n    border-radius: .35rem .35rem 0 0;\n    background: linear-gradient(180deg, var(--color-accent), #3b82f6);\n    min-block-size: 4px;\n  }\n\n  .eq-bar--1 { block-size: calc(4px + var(--_f1) * 10rem); }\n  .eq-bar--2 { block-size: calc(4px + var(--_f2) * 10rem); }\n  .eq-bar--3 { block-size: calc(4px + var(--_f3) * 10rem); }\n  .eq-bar--4 { block-size: calc(4px + var(--_f4) * 10rem); }\n  .eq-bar--5 { block-size: calc(4px + var(--_f5) * 10rem); }\n  .eq-bar--6 { block-size: calc(4px + var(--_f6) * 10rem); }\n}","js":""},{"id":"css-lab2/08-theme-blend","lab":"css-lab2","folder":"08-theme-blend","title":"Theme Blend","html":"<header>\n  <h1>Theme Blend</h1>\n  <p>A single slider-linked <code>--_f</code> feeds <code>color-mix(in oklch, ...)</code> for background, text, and border together, crossfading a mini UI between dark and light. A live theme toggle with no <code>:root</code> class swap and no JavaScript.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"stage-control\">\n    <label for=\"blend\">Dark &#8596; Light</label>\n    <input type=\"range\" id=\"blend\" class=\"range-slider\" value=\"0\">\n  </div>\n  <div class=\"blend-card\">\n    <h2>Panel preview</h2>\n    <p>Every color on this card is a live mix of a dark token and a light token, keyed off the same slider position.</p>\n    <button type=\"button\">Action</button>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@property --_f {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n\n@layer overrides {\n  :root {\n    timeline-scope: --_f;\n    animation: --_f linear both;\n    animation-timeline: --_f;\n    animation-range: entry 100% exit 0%;\n  }\n\n  @keyframes --_f {\n    0% { --_f: 1; }\n  }\n\n  .range-slider::-webkit-slider-thumb {\n    view-timeline: --_f inline;\n  }\n\n  .range-slider::-moz-range-thumb {\n    view-timeline: --_f inline;\n  }\n}\n\n@layer components {\n  .blend-card {\n    --dark-bg: var(--color-surface);\n    --light-bg: #f8fafc;\n    --dark-text: var(--color-text);\n    --light-text: #0f172a;\n    --dark-border: var(--color-border);\n    --light-border: #cbd5e1;\n\n    padding: 1.5rem;\n    border-radius: .75rem;\n    background: color-mix(in oklch, var(--dark-bg) calc((1 - var(--_f)) * 100%), var(--light-bg) calc(var(--_f) * 100%));\n    color: color-mix(in oklch, var(--dark-text) calc((1 - var(--_f)) * 100%), var(--light-text) calc(var(--_f) * 100%));\n    border: 1px solid color-mix(in oklch, var(--dark-border) calc((1 - var(--_f)) * 100%), var(--light-border) calc(var(--_f) * 100%));\n  }\n\n  .blend-card h2 {\n    margin-block-start: 0;\n  }\n\n  .blend-card button {\n    background: var(--color-accent);\n    color: var(--color-bg);\n    border: none;\n    border-radius: .5rem;\n    padding: .5rem 1rem;\n    font: inherit;\n    cursor: pointer;\n  }\n}","js":""},{"id":"css-lab2/09-contrast-color-picker","lab":"css-lab2","folder":"09-contrast-color-picker","title":"Contrast Color Picker","html":"<header>\n  <h1>Contrast Color Picker</h1>\n  <p>Seven radio-button swatches set a <code>--brand</code> custom property via <code>:has()</code> — no JavaScript. The preview card reads it straight into <code>contrast-color(var(--brand))</code>, which picks black or white text for you, and the label below always stays readable.</p>\n</header>\n<div class=\"stage\">\n  <fieldset class=\"swatch-row\">\n    <legend class=\"visually-hidden\">Brand color</legend>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-1\" class=\"brand-radio\" checked>\n    <label for=\"brand-1\" class=\"brand-swatch brand-swatch--1\"><span class=\"visually-hidden\">Light blue</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-2\" class=\"brand-radio\">\n    <label for=\"brand-2\" class=\"brand-swatch brand-swatch--2\"><span class=\"visually-hidden\">Navy</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-3\" class=\"brand-radio\">\n    <label for=\"brand-3\" class=\"brand-swatch brand-swatch--3\"><span class=\"visually-hidden\">Purple</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-4\" class=\"brand-radio\">\n    <label for=\"brand-4\" class=\"brand-swatch brand-swatch--4\"><span class=\"visually-hidden\">Blue</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-5\" class=\"brand-radio\">\n    <label for=\"brand-5\" class=\"brand-swatch brand-swatch--5\"><span class=\"visually-hidden\">Teal</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-6\" class=\"brand-radio\">\n    <label for=\"brand-6\" class=\"brand-swatch brand-swatch--6\"><span class=\"visually-hidden\">Yellow</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-7\" class=\"brand-radio\">\n    <label for=\"brand-7\" class=\"brand-swatch brand-swatch--7\"><span class=\"visually-hidden\">Near white</span></label>\n  </fieldset>\n\n  <button type=\"button\" class=\"preview\">\n    Save changes\n    <span class=\"preview-hex\"></span>\n  </button>\n\n  <pre class=\"code-block\"><code>.card {\n  --brand: <span class=\"hex-echo\"></span>;\n  background: var(--brand);\n  color: contrast-color(var(--brand));\n}</code></pre>\n</div>","css":"@layer res gistered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --color-swatch-1: #e5f2ff;\n    --color-swatch-2: #0f172a;\n    --color-swatch-3: #581c87;\n    --color-swatch-4: #2563eb;\n    --color-swatch-5: #0d9488;\n    --color-swatch-6: #eab308;\n    --color-swatch-7: #f8fafc;\n  }\n}\n\n@layer overrides {\n  .stage:has(#brand-1:checked) { --brand: var(--color-swatch-1); --brand-hex: \"#e5f2ff\"; }\n  .stage:has(#brand-2:checked) { --brand: var(--color-swatch-2); --brand-hex: \"#0f172a\"; }\n  .stage:has(#brand-3:checked) { --brand: var(--color-swatch-3); --brand-hex: \"#581c87\"; }\n  .stage:has(#brand-4:checked) { --brand: var(--color-swatch-4); --brand-hex: \"#2563eb\"; }\n  .stage:has(#brand-5:checked) { --brand: var(--color-swatch-5); --brand-hex: \"#0d9488\"; }\n  .stage:has(#brand-6:checked) { --brand: var(--color-swatch-6); --brand-hex: \"#eab308\"; }\n  .stage:has(#brand-7:checked) { --brand: var(--color-swatch-7); --brand-hex: \"#f8fafc\"; }\n}\n\n@layer components {\n  .swatch-row {\n    display: flex;\n    flex-wrap: wrap;\n    gap: .6rem;\n    padding: 0;\n    margin: 0 0 2rem;\n    border: 0;\n  }\n\n  .brand-radio {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n\n  .brand-swatch {\n    inline-size: 2.5rem;\n    block-size: 2.5rem;\n    border-radius: .5rem;\n    border: 1px solid var(--color-border);\n    cursor: pointer;\n  }\n\n  .brand-radio:checked + .brand-swatch {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  .brand-radio:focus-visible + .brand-swatch {\n    outline: 2px solid var(--color-accent);\n    outline-offset: 2px;\n  }\n\n  .brand-swatch--1 { background: var(--color-swatch-1); }\n  .brand-swatch--2 { background: var(--color-swatch-2); }\n  .brand-swatch--3 { background: var(--color-swatch-3); }\n  .brand-swatch--4 { background: var(--color-swatch-4); }\n  .brand-swatch--5 { background: var(--color-swatch-5); }\n  .brand-swatch--6 { background: var(--color-swatch-6); }\n  .brand-swatch--7 { background: var(--color-swatch-7); }\n\n  .preview {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-direction: column;\n    gap: .35rem;\n    inline-size: 100%;\n    block-size: 8rem;\n    border-radius: .75rem;\n    border: 1px solid var(--color-border);\n    background: var(--brand);\n    color: contrast-color(var(--brand));\n    font: inherit;\n    font-weight: 600;\n    font-size: 1.1rem;\n    cursor: pointer;\n  }\n\n  .preview-hex {\n    font-family: ui-monospace, monospace;\n    font-size: .75rem;\n    font-weight: 400;\n    opacity: .75;\n  }\n\n  .preview-hex::before {\n    content: var(--brand-hex);\n  }\n\n  .code-block {\n    margin: 2rem 0 0;\n    padding: 1.25rem 1.5rem;\n    border-radius: .75rem;\n    border: 1px solid var(--color-border);\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-family: ui-monospace, monospace;\n    font-size: .85rem;\n    line-height: 1.6;\n    overflow-x: auto;\n  }\n\n  .code-block .hex-echo {\n    color: var(--color-accent);\n  }\n\n  .code-block .hex-echo::before {\n    content: var(--brand-hex);\n  }\n}","js":""},{"id":"css-lab2/10-brand-palette","lab":"css-lab2","folder":"10-brand-palette","title":"Brand Palette","html":"<header>\n  <h1>Brand Palette</h1>\n  <p>Pick one brand color and CSS derives the rest: <code>color-mix()</code> makes a light and dark shade, relative color syntax (<code>rgb(from var(--brand) r 0 0)</code>) peels apart its R/G/B channels, and <code>contrast-color()</code> recomputes readable text independently for all six swatches — no JavaScript, and no color picked by hand except the first one.</p>\n</header>\n<div class=\"stage\">\n  <h2 class=\"section-label\">Brand Color</h2>\n  <fieldset class=\"swatch-row\">\n    <legend class=\"visually-hidden\">Brand color</legend>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-1\" class=\"brand-radio\" checked>\n    <label for=\"brand-1\" class=\"brand-swatch brand-swatch--1\"><span class=\"visually-hidden\">Light blue</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-2\" class=\"brand-radio\">\n    <label for=\"brand-2\" class=\"brand-swatch brand-swatch--2\"><span class=\"visually-hidden\">Navy</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-3\" class=\"brand-radio\">\n    <label for=\"brand-3\" class=\"brand-swatch brand-swatch--3\"><span class=\"visually-hidden\">Purple</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-4\" class=\"brand-radio\">\n    <label for=\"brand-4\" class=\"brand-swatch brand-swatch--4\"><span class=\"visually-hidden\">Blue</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-5\" class=\"brand-radio\">\n    <label for=\"brand-5\" class=\"brand-swatch brand-swatch--5\"><span class=\"visually-hidden\">Teal</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-6\" class=\"brand-radio\">\n    <label for=\"brand-6\" class=\"brand-swatch brand-swatch--6\"><span class=\"visually-hidden\">Yellow</span></label>\n\n    <input type=\"radio\" name=\"brand\" id=\"brand-7\" class=\"brand-radio\">\n    <label for=\"brand-7\" class=\"brand-swatch brand-swatch--7\"><span class=\"visually-hidden\">Near white</span></label>\n  </fieldset>\n\n  <h2 class=\"section-label\">Derived Palette</h2>\n  <div class=\"palette\">\n    <div class=\"palette-swatch palette-swatch--base\">\n      <span class=\"palette-label\">Base</span>\n      <span class=\"palette-value hex-echo\"></span>\n    </div>\n    <div class=\"palette-swatch palette-swatch--light\">\n      <span class=\"palette-label\">Light +30%</span>\n    </div>\n    <div class=\"palette-swatch palette-swatch--dark\">\n      <span class=\"palette-label\">Dark +30%</span>\n    </div>\n    <div class=\"palette-swatch palette-swatch--r\">\n      <span class=\"palette-label\">Red channel</span>\n    </div>\n    <div class=\"palette-swatch palette-swatch--g\">\n      <span class=\"palette-label\">Green channel</span>\n    </div>\n    <div class=\"palette-swatch palette-swatch--b\">\n      <span class=\"palette-label\">Blue channel</span>\n    </div>\n  </div>\n\n  <pre class=\"code-block\"><code>.card {\n  --brand: <span class=\"hex-echo\"></span>;\n  --brand-light: color-mix(in srgb, var(--brand), #fff 30%);\n  --brand-dark: color-mix(in srgb, var(--brand), #000 30%);\n  --brand-r: rgb(from var(--brand) r 0 0);\n  --brand-g: rgb(from var(--brand) 0 g 0);\n  --brand-b: rgb(from var(--brand) 0 0 b);\n}\n/* every swatch above reads its own contrast-color(var(--x)) */</code></pre>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --color-swatch-1: #e5f2ff;\n    --color-swatch-2: #0f172a;\n    --color-swatch-3: #581c87;\n    --color-swatch-4: #2563eb;\n    --color-swatch-5: #0d9488;\n    --color-swatch-6: #eab308;\n    --color-swatch-7: #f8fafc;\n\n    /* Local to this demo's card redesign — the rest of the lab keeps the\n       shared dashed \"experiment box\" look in _shared.css, only this page's\n       .stage is restyled as a polished panel (see the .stage override below). */\n    --radius-card: 1.25rem;\n    --radius-control: 1rem;\n  }\n}\n\n@layer overrides {\n  .stage:has(#brand-1:checked) { --brand: var(--color-swatch-1); --brand-hex: \"#e5f2ff\"; }\n  .stage:has(#brand-2:checked) { --brand: var(--color-swatch-2); --brand-hex: \"#0f172a\"; }\n  .stage:has(#brand-3:checked) { --brand: var(--color-swatch-3); --brand-hex: \"#581c87\"; }\n  .stage:has(#brand-4:checked) { --brand: var(--color-swatch-4); --brand-hex: \"#2563eb\"; }\n  .stage:has(#brand-5:checked) { --brand: var(--color-swatch-5); --brand-hex: \"#0d9488\"; }\n  .stage:has(#brand-6:checked) { --brand: var(--color-swatch-6); --brand-hex: \"#eab308\"; }\n  .stage:has(#brand-7:checked) { --brand: var(--color-swatch-7); --brand-hex: \"#f8fafc\"; }\n\n  /* Swap the lab's shared dashed debug-box look for a polished panel on this\n     page only — later layer wins over _shared.css's .stage without needing\n     extra specificity. */\n  .stage {\n    padding: 2rem 1.75rem;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-card);\n    background: var(--stage-bg);\n    box-shadow:\n      0 24px 48px -24px var(--shadow-color),\n      0 4px 12px -6px var(--shadow-color);\n  }\n}\n\n@layer components {\n  .section-label {\n    margin: 0 0 .75rem;\n    font-size: .8rem;\n    font-weight: 600;\n    color: var(--color-muted);\n  }\n\n  .swatch-row {\n    display: flex;\n    flex-wrap: wrap;\n    gap: .75rem;\n    padding: 0;\n    margin: 0 0 2rem;\n    border: 0;\n  }\n\n  .brand-radio {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n\n  .brand-swatch {\n    position: relative;\n    inline-size: 2.75rem;\n    block-size: 2.75rem;\n    border-radius: 50%;\n    border: 1px solid var(--color-border);\n    cursor: pointer;\n    transition: transform 150ms ease;\n  }\n\n  @media (prefers-reduced-motion: no-preference) {\n    .brand-radio:checked + .brand-swatch {\n      transform: scale(1.08);\n    }\n  }\n\n  /* Selection is shown with a checkmark badge (below), not this ring alone —\n     :checked is still native, so screen readers get the state either way.\n     Specificity (0,3,1): the radio-hack's class+:checked+class chain is the\n     selector's minimum necessary form for a no-JS \"if this input is checked,\n     style that sibling\" rule — can't be reduced without extra markup or JS. */\n  .brand-radio:checked + .brand-swatch::after {\n    content: \"\\2713\";\n    position: absolute;\n    inset-block-end: -.2rem;\n    inset-inline-end: -.2rem;\n    inline-size: 1.125rem;\n    block-size: 1.125rem;\n    display: grid;\n    place-items: center;\n    border-radius: 50%;\n    border: 2px solid var(--stage-bg);\n    background: var(--color-accent);\n    color: contrast-color(var(--color-accent));\n    font-size: .65rem;\n    font-weight: 700;\n    line-height: 1;\n  }\n\n  .brand-radio:focus-visible + .brand-swatch {\n    outline: 2px solid var(--color-accent);\n    outline-offset: 3px;\n  }\n\n  .brand-swatch--1 { background: var(--color-swatch-1); }\n  .brand-swatch--2 { background: var(--color-swatch-2); }\n  .brand-swatch--3 { background: var(--color-swatch-3); }\n  .brand-swatch--4 { background: var(--color-swatch-4); }\n  .brand-swatch--5 { background: var(--color-swatch-5); }\n  .brand-swatch--6 { background: var(--color-swatch-6); }\n  .brand-swatch--7 { background: var(--color-swatch-7); }\n\n  .palette {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));\n    gap: .75rem;\n  }\n\n  .palette-swatch {\n    display: flex;\n    flex-direction: column;\n    justify-content: flex-end;\n    gap: .15rem;\n    block-size: 6rem;\n    padding: .75rem;\n    border-radius: var(--radius-control);\n    border: 1px solid var(--color-border);\n    font-weight: 600;\n    font-size: .8rem;\n  }\n\n  .palette-value {\n    font-family: ui-monospace, monospace;\n    font-size: .7rem;\n    font-weight: 400;\n    opacity: .75;\n  }\n\n  .palette-swatch {\n    background: var(--swatch-color);\n    color: contrast-color(var(--swatch-color));\n  }\n\n  .palette-swatch--base  { --swatch-color: var(--brand); }\n  .palette-swatch--light { --swatch-color: color-mix(in srgb, var(--brand), #fff 30%); }\n  .palette-swatch--dark  { --swatch-color: color-mix(in srgb, var(--brand), #000 30%); }\n  .palette-swatch--r     { --swatch-color: rgb(from var(--brand) r 0 0); }\n  .palette-swatch--g     { --swatch-color: rgb(from var(--brand) 0 g 0); }\n  .palette-swatch--b     { --swatch-color: rgb(from var(--brand) 0 0 b); }\n\n  .code-block {\n    margin: 2rem 0 0;\n    padding: 1.25rem 1.5rem;\n    border-radius: var(--radius-control);\n    border: 1px solid var(--color-border);\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-family: ui-monospace, monospace;\n    font-size: .85rem;\n    line-height: 1.6;\n    overflow-x: auto;\n  }\n\n  .code-block .hex-echo {\n    color: var(--color-accent);\n  }\n\n  .hex-echo::before {\n    content: var(--brand-hex);\n  }\n}","js":""},{"id":"css-lab2/11-color-shift-progress","lab":"css-lab2","folder":"11-color-shift-progress","title":"Color-Shift Progress Bar","html":"<header>\n  <h1>Color-Shift Progress Bar</h1>\n  <p>A looping <code>@keyframes</code> animation drives a registered number <em>and</em> a registered integer at once. The number sweeps the fill's hue from red to green (<code>hsl(calc(var(--_p) * 120) 70% 50%)</code>), and the integer feeds a CSS counter for the live \"<code>N%</code>\" label. <code>contrast-color()</code> keeps that label readable through the whole sweep. No JavaScript.</p>\n</header>\n<div class=\"stage\">\n  <div class=\"progress-demo\">\n    <div class=\"progress-header\">\n      <span class=\"progress-caption\">Uploading…</span>\n      <span class=\"progress-readout\"></span>\n    </div>\n    <div class=\"progress-track\">\n      <div class=\"progress-fill\"></div>\n    </div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: #0b0d10;\n    --color-surface: #151922;\n    --color-surface-2: #1c212c;\n    --color-text: #f1f3f5;\n    --color-muted: #9aa4b2;\n    --color-border: #303846;\n    --color-accent: #34d399;\n    --stage-bg: #0f1218;\n    --stage-border: #3a4352;\n    --shadow-color: rgb(0 0 0 / 13%);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  button {\n    background: var(--color-surface-2);\n    color: var(--color-text);\n    border-color: var(--color-border);\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n\n  .stage-controls {\n    display: grid;\n    gap: 1.25rem;\n    margin-block-end: 2rem;\n  }\n\n  .stage-control label {\n    display: flex;\n    justify-content: space-between;\n    font-size: .8rem;\n    color: var(--color-muted);\n    margin-block-end: .35rem;\n  }\n}\n\n@layer components {\n  /* Shared cosmetic reset for every range input in this lab. The scroll-driven\n     view-timeline wiring that makes the slider live-update a CSS variable is\n     registered per demo (each needs its own property name/count) — this only\n     makes the native control look intentional instead of browser-default. */\n  input[type=\"range\"].range-slider {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 100%;\n    block-size: 1.5rem;\n    background: transparent;\n    margin: 0;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-runnable-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-track {\n    block-size: 4px;\n    background: var(--color-border);\n    border-radius: 2px;\n  }\n\n  input[type=\"range\"].range-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    appearance: none;\n    inline-size: 16px;\n    block-size: 16px;\n    margin-block-start: -6px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider::-moz-range-thumb {\n    inline-size: 16px;\n    block-size: 16px;\n    border-radius: 50%;\n    background: var(--color-accent);\n    border: 2px solid var(--color-bg);\n    box-shadow: 0 0 0 1px var(--color-accent);\n    cursor: pointer;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-webkit-slider-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  input[type=\"range\"].range-slider:focus-visible::-moz-range-thumb {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@property --_p {\n  syntax: \"<number>\";\n  inherits: true;\n  initial-value: 0;\n}\n@property --_n {\n  syntax: \"<integer>\";\n  inherits: true;\n  initial-value: 0;\n}\n\n@layer overrides {\n  .progress-demo {\n    animation: sweep-p 3s ease-in-out infinite alternate, sweep-n 3s ease-in-out infinite alternate;\n  }\n\n  @keyframes sweep-p {\n    from { --_p: 0; }\n    to { --_p: 1; }\n  }\n\n  @keyframes sweep-n {\n    from { --_n: 0; }\n    to { --_n: 100; }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .progress-demo {\n      animation-play-state: paused;\n    }\n  }\n}\n\n@layer components {\n  .progress-demo {\n    /* single source of truth — the fill and the readout badge both read this,\n       so the hue math only exists once (see the demo 10 palette refactor). */\n    --fill-color: hsl(calc(var(--_p) * 120) 70% 50%);\n    margin-block-start: .5rem;\n  }\n\n  .progress-header {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-block-end: .6rem;\n  }\n\n  .progress-caption {\n    font-size: .85rem;\n    color: var(--color-muted);\n  }\n\n  .progress-readout {\n    min-inline-size: 3.25rem;\n    padding: .2rem .6rem;\n    border-radius: 999px;\n    background: var(--fill-color);\n    color: contrast-color(var(--fill-color));\n    font-family: ui-monospace, monospace;\n    font-size: .8rem;\n    font-weight: 700;\n    text-align: center;\n  }\n\n  .progress-readout::before {\n    counter-reset: pct var(--_n);\n    content: counter(pct) \"%\";\n  }\n\n  .progress-track {\n    inline-size: 100%;\n    block-size: 1.25rem;\n    border-radius: 999px;\n    border: 1px solid var(--color-border);\n    background: var(--color-surface);\n    overflow: hidden;\n  }\n\n  .progress-fill {\n    inline-size: calc(var(--_p) * 100%);\n    block-size: 100%;\n    background: var(--fill-color);\n  }\n}","js":""},{"id":"css-lab3/01-anchor-nav-highlight","lab":"css-lab3","folder":"01-anchor-nav-highlight","title":"Anchor-Positioned Nav Highlight","html":"<header>\n  <h1>Anchor-Positioned Nav Highlight</h1>\n  <p>Hover or tab through the links. The highlight is one element, anchored to whichever link is active via a single shared <code>anchor-name</code> — see <a href=\"../docs/anchor-nav-highlight.md\">docs</a> for how the anchor swap and the cutout background work.</p>\n</header>\n\n<div class=\"demo-stage\">\n  <nav class=\"showcase-nav\" aria-label=\"Demo navigation\">\n    <ul>\n      <li><a href=\"#home\">Home</a></li>\n      <li><a href=\"#about\">About</a></li>\n      <li><a href=\"#team\">Our team</a></li>\n    </ul>\n  </nav>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(16% 0.015 50);\n    --color-surface: oklch(22% 0.015 50);\n    --color-text: oklch(97% 0.01 90);\n    --color-muted: oklch(72% 0.02 80);\n    --color-border: oklch(34% 0.02 60);\n    --color-accent: oklch(72% 0.15 45);\n    --stage-bg: oklch(11% 0.015 50);\n    --stage-border: oklch(36% 0.02 60);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --page-bg-image:\n      radial-gradient(ellipse 70% 60% at 50% 55%, oklch(58% 0.16 45 / 75%), transparent 70%),\n      radial-gradient(ellipse 60% 55% at 15% 80%, oklch(42% 0.12 30 / 55%), transparent 70%),\n      radial-gradient(ellipse 70% 65% at 88% 20%, oklch(38% 0.09 40 / 50%), transparent 70%),\n      linear-gradient(oklch(16% 0.02 45), oklch(9% 0.015 40));\n    --nav-radius: 1.5rem;\n    --pill-radius: 1rem;\n    --nav-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n    --nav-transition-duration: .45s;\n  }\n}\n\n@layer base {\n  body {\n    background-color: oklch(9% 0.015 40);\n    background-image: var(--page-bg-image);\n    background-attachment: fixed;\n    background-size: cover;\n    min-block-size: 100dvh;\n  }\n}\n\n@layer layout {\n  .demo-stage {\n    display: grid;\n    place-items: center;\n    min-block-size: 60dvh;\n    padding: 2rem 1rem;\n  }\n}\n\n@layer components {\n  .showcase-nav {\n    position: relative;\n    isolation: isolate;\n    padding: .35rem;\n    background: oklch(12% 0.02 40 / 96%);\n    border: 1px solid oklch(45% 0.03 50 / 35%);\n    border-radius: var(--nav-radius);\n  }\n\n  .showcase-nav ul {\n    position: relative;\n    z-index: 1;\n    display: flex;\n    list-style: none;\n    margin: 0;\n    padding: 0;\n  }\n\n  .showcase-nav a {\n    display: block;\n    position: relative;\n    padding: .85rem 1.5rem;\n    border-radius: calc(var(--nav-radius) - .35rem);\n    color: var(--color-text);\n    font-weight: 600;\n    text-decoration: none;\n  }\n\n  /* Fallback indicator for browsers without anchor positioning: a plain\n     underline per link. Hidden once the anchor-driven version above takes over. */\n  .showcase-nav a::after {\n    content: \"\";\n    position: absolute;\n    inset-inline: .75rem;\n    inset-block-end: .35rem;\n    block-size: 2px;\n    border-radius: 999px;\n    background: var(--color-accent);\n    scale: 0 1;\n  }\n\n  @media (prefers-reduced-motion: no-preference) {\n    .showcase-nav a::after {\n      transition: scale .2s ease;\n    }\n  }\n\n  .showcase-nav a:hover::after,\n  .showcase-nav a:focus-visible::after {\n    scale: 1 1;\n  }\n\n  @supports (corner-shape: squircle) {\n    .showcase-nav {\n      corner-shape: squircle;\n    }\n  }\n\n  @supports (anchor-name: --a) {\n    .showcase-nav a::after {\n      display: none;\n    }\n\n    .showcase-nav li:hover,\n    .showcase-nav li:focus-within {\n      /* Same anchor name moves to whichever link is active. The name itself\n         never changes, so the anchor()-based offsets below stay animatable —\n         swapping *which* element owns a name is continuous, swapping\n         position-anchor itself would be a discrete (unanimatable) jump. The\n         li stays position:static: an anchor-name element that is also\n         position:relative fails to resolve as a valid anchor. */\n      anchor-name: --hovered-link;\n    }\n\n    .showcase-nav::before,\n    .showcase-nav::after {\n      content: \"\";\n      position: absolute;\n      position-anchor: --hovered-link;\n      position-try-fallbacks: flip-block, flip-inline;\n      top: anchor(top);\n      right: anchor(right);\n      bottom: anchor(bottom);\n      left: anchor(left);\n      border-radius: var(--pill-radius);\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    @supports (corner-shape: squircle) {\n      .showcase-nav::before,\n      .showcase-nav::after {\n        corner-shape: squircle;\n      }\n    }\n\n    @media (prefers-reduced-motion: no-preference) {\n      .showcase-nav::before,\n      .showcase-nav::after {\n        /* Animating inset properties instead of transform is normally\n           avoided for performance, but it is the whole point of this demo:\n           the anchor-name reassignment trick above only pays off if these\n           offsets can transition. */\n        transition:\n          top var(--nav-transition-duration) var(--nav-spring),\n          right var(--nav-transition-duration) var(--nav-spring),\n          bottom var(--nav-transition-duration) var(--nav-spring),\n          left var(--nav-transition-duration) var(--nav-spring),\n          opacity .2s ease;\n      }\n    }\n\n    /* Duplicates the page's fixed-attachment background so this layer reads\n       as a window into the page rather than a separately drawn shape. */\n    .showcase-nav::after {\n      z-index: -2;\n      background-image: var(--page-bg-image);\n      background-attachment: fixed;\n    }\n\n    .showcase-nav::before {\n      z-index: -1;\n      background: oklch(0% 0 0 / 8%);\n      border: 1px solid oklch(95% 0.01 60 / 14%);\n      backdrop-filter: blur(4px);\n    }\n\n    .showcase-nav:has(li:hover, li:focus-within)::before,\n    .showcase-nav:has(li:hover, li:focus-within)::after {\n      opacity: 1;\n    }\n  }\n}","js":""},{"id":"css-lab4/01-trimmed-type","lab":"css-lab4","folder":"01-trimmed-type","title":"Trimmed Type","html":"<header>\n  <h1>Trimmed Type</h1>\n  <p>Same text, same exaggerated <code>line-height: 2.2</code>, in all four rows. The highlight color behind \"Agypqj\" (a cap, an ascender, and three different descenders, chosen to catch trimming on both edges) <em>is</em> the text's actual box, background-color always fills the full line box, trimmed or not. Watch the highlight shrink from the top only, then the bottom only, then both, as <code>text-box-trim</code> changes.</p>\n</header>\n\n<div class=\"stage\">\n  <ul class=\"trim-list\">\n    <li>\n      <p class=\"trim-label\">text-box-trim: normal;</p>\n      <span class=\"trim-sample\">Agypqj</span>\n    </li>\n    <li>\n      <p class=\"trim-label\">text-box-trim: trim-start;<br>text-box-edge: cap alphabetic;</p>\n      <span class=\"trim-sample trim-sample--start\">Agypqj</span>\n    </li>\n    <li>\n      <p class=\"trim-label\">text-box-trim: trim-end;<br>text-box-edge: cap alphabetic;</p>\n      <span class=\"trim-sample trim-sample--end\">Agypqj</span>\n    </li>\n    <li>\n      <p class=\"trim-label\">text-box-trim: trim-both;<br>text-box-edge: cap alphabetic;</p>\n      <span class=\"trim-sample trim-sample--both\">Agypqj</span>\n    </li>\n  </ul>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 250);\n    --color-surface: oklch(21% 0.02 250);\n    --color-text: oklch(96% 0.01 240);\n    --color-muted: oklch(70% 0.02 240);\n    --color-border: oklch(33% 0.02 245);\n    --color-accent: oklch(75% 0.14 225);\n    --stage-bg: oklch(11% 0.02 250);\n    --stage-border: oklch(35% 0.02 245);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  .trim-list {\n    display: grid;\n    gap: 1rem;\n    max-inline-size: 420px;\n    margin-inline: auto;\n    padding: 0;\n    list-style: none;\n  }\n\n  .trim-list li {\n    display: grid;\n    gap: .75rem;\n    justify-items: start;\n    padding: 1.1rem 1.25rem;\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n  }\n\n  .trim-label {\n    margin: 0;\n    font-family: ui-monospace, monospace;\n    font-size: .78rem;\n    line-height: 1.4;\n    color: var(--color-muted);\n  }\n\n  /* The background is the whole point: it paints the element's real box,\n     so an exaggerated line-height (inflating the invisible half-leading)\n     shows up directly as visible highlight above/below the glyphs instead\n     of something you have to infer. */\n  .trim-sample {\n    padding-inline: .4rem;\n    background: var(--color-accent);\n    color: oklch(15% 0.02 250);\n    font-size: 2.5rem;\n    font-weight: 800;\n    line-height: 2.2;\n  }\n\n  .trim-sample--start {\n    text-box-trim: trim-start;\n    text-box-edge: cap alphabetic;\n  }\n\n  .trim-sample--end {\n    text-box-trim: trim-end;\n    text-box-edge: cap alphabetic;\n  }\n\n  .trim-sample--both {\n    text-box-trim: trim-both;\n    text-box-edge: cap alphabetic;\n  }\n}","js":""},{"id":"css-lab4/02-signal-meter","lab":"css-lab4","folder":"02-signal-meter","title":"Signal Meter","html":"<header>\n  <h1>Signal Meter</h1>\n  <p>Each preset is a raw reading on its own scale (0-100 here). The CSS <code>progress()</code> function maps that raw number onto a 0-1 fraction directly in <code>calc()</code>, no JavaScript division required, and the same fraction drives both the fill width and its hue.</p>\n</header>\n\n<div class=\"stage\">\n  <div class=\"meter-demo\">\n    <fieldset class=\"preset-picker\">\n      <legend>Reading</legend>\n      <label class=\"preset-option\">\n        <input type=\"radio\" name=\"level\" id=\"lvl-1\">\n        <span>Low</span>\n      </label>\n      <label class=\"preset-option\">\n        <input type=\"radio\" name=\"level\" id=\"lvl-2\" checked>\n        <span>Fair</span>\n      </label>\n      <label class=\"preset-option\">\n        <input type=\"radio\" name=\"level\" id=\"lvl-3\">\n        <span>Good</span>\n      </label>\n      <label class=\"preset-option\">\n        <input type=\"radio\" name=\"level\" id=\"lvl-4\">\n        <span>Excellent</span>\n      </label>\n    </fieldset>\n\n    <div class=\"meter\">\n      <div class=\"meter-track\">\n        <div class=\"meter-fill\"></div>\n      </div>\n      <p class=\"meter-readout\"></p>\n    </div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 250);\n    --color-surface: oklch(21% 0.02 250);\n    --color-text: oklch(96% 0.01 240);\n    --color-muted: oklch(70% 0.02 240);\n    --color-border: oklch(33% 0.02 245);\n    --color-accent: oklch(75% 0.14 225);\n    --stage-bg: oklch(11% 0.02 250);\n    --stage-border: oklch(35% 0.02 245);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@property --raw {\n  syntax: \"<integer>\";\n  inherits: true;\n  initial-value: 52;\n}\n\n@layer components {\n  .meter-demo {\n    /* Each preset's own raw reading, on its own 0-100 scale. progress()\n       below is what turns this into a fraction: nothing here is\n       pre-divided. */\n    --raw: 52;\n  }\n\n  .meter-demo:has(#lvl-1:checked) {\n    --raw: 18;\n  }\n\n  .meter-demo:has(#lvl-2:checked) {\n    --raw: 52;\n  }\n\n  .meter-demo:has(#lvl-3:checked) {\n    --raw: 78;\n  }\n\n  .meter-demo:has(#lvl-4:checked) {\n    --raw: 100;\n  }\n\n  .preset-picker {\n    display: flex;\n    flex-wrap: wrap;\n    gap: .5rem;\n    margin: 0 0 2rem;\n    padding: 0;\n    border: 0;\n  }\n\n  .preset-picker legend {\n    inline-size: 100%;\n    margin-block-end: .5rem;\n    font-size: .8rem;\n    color: var(--color-muted);\n  }\n\n  .preset-option input {\n    position: absolute;\n    opacity: 0;\n    inline-size: 1px;\n    block-size: 1px;\n  }\n\n  .preset-option span {\n    display: inline-block;\n    padding: .5rem 1rem;\n    border-radius: 999px;\n    border: 1px solid var(--color-border);\n    color: var(--color-muted);\n    cursor: pointer;\n  }\n\n  .preset-option input:checked + span {\n    border-color: var(--color-accent);\n    color: var(--color-text);\n    background: color-mix(in oklch, var(--color-accent) 20%, transparent);\n  }\n\n  .preset-option input:focus-visible + span {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n\n  .meter-track {\n    inline-size: 100%;\n    block-size: 1.5rem;\n    border-radius: 999px;\n    border: 1px solid var(--color-border);\n    background: var(--color-surface);\n    overflow: hidden;\n  }\n\n  .meter-fill {\n    block-size: 100%;\n    /* Static fallback for browsers without progress() support, overridden\n       below once it's confirmed available. */\n    inline-size: 50%;\n    background: var(--color-accent);\n  }\n\n  /* progress() returns a bare number, not a length, so testing\n     \"width: progress(...)\" directly is invalid regardless of support and\n     always fails. Wrapping it in calc(... * 100%) produces an actual\n     length-percentage, which is what makes this a real support test. */\n  @supports (width: calc(progress(1, 0, 1) * 100%)) {\n    .meter-fill {\n      inline-size: calc(progress(var(--raw), 0, 100) * 100%);\n      background: hsl(calc(progress(var(--raw), 0, 100) * 120) 70% 50%);\n      transition: inline-size .3s ease, background-color .3s ease;\n    }\n  }\n\n  .meter-readout {\n    margin: .75rem 0 0;\n    font-family: ui-monospace, monospace;\n    font-size: .9rem;\n    color: var(--color-muted);\n  }\n\n  .meter-readout::before {\n    counter-reset: pct var(--raw);\n    content: \"raw \" counter(pct) \" -> progress() \" counter(pct) \"/100\";\n  }\n}","js":""},{"id":"css-lab4/03-staggered-reveal","lab":"css-lab4","folder":"03-staggered-reveal","title":"Staggered Reveal","html":"<header>\n  <h1>Staggered Reveal</h1>\n  <p>Each row's <code>animation-delay</code> is <code>calc(sibling-index() * 80ms)</code>, read straight off its position in the list. No <code>:nth-child()</code> chain of hand-written delays, no JavaScript loop assigning inline styles. Reload the page to replay it.</p>\n</header>\n\n<div class=\"stage\">\n  <ul class=\"stagger-list\">\n    <li><span class=\"dot\"></span>Build finished in 4.2s</li>\n    <li><span class=\"dot\"></span>3 tests updated</li>\n    <li><span class=\"dot\"></span>Bundle size: 128kb</li>\n    <li><span class=\"dot\"></span>Lint: 0 warnings</li>\n    <li><span class=\"dot\"></span>Deployed to staging</li>\n    <li><span class=\"dot\"></span>Preview link ready</li>\n    <li><span class=\"dot\"></span>Notified 2 reviewers</li>\n  </ul>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 250);\n    --color-surface: oklch(21% 0.02 250);\n    --color-text: oklch(96% 0.01 240);\n    --color-muted: oklch(70% 0.02 240);\n    --color-border: oklch(33% 0.02 245);\n    --color-accent: oklch(75% 0.14 225);\n    --stage-bg: oklch(11% 0.02 250);\n    --stage-border: oklch(35% 0.02 245);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  .stagger-list {\n    display: grid;\n    gap: .6rem;\n    margin: 0;\n    padding: 0;\n    list-style: none;\n    font-family: ui-monospace, monospace;\n    font-size: .95rem;\n  }\n\n  .stagger-list li {\n    display: flex;\n    align-items: center;\n    gap: .65rem;\n    padding: .75rem 1rem;\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n  }\n\n  .dot {\n    inline-size: .5rem;\n    block-size: .5rem;\n    border-radius: 50%;\n    background: var(--color-accent);\n    flex-shrink: 0;\n  }\n\n  @media (prefers-reduced-motion: no-preference) {\n    .stagger-list li {\n      opacity: 0;\n      translate: 0 .75rem;\n      animation: reveal .5s ease forwards;\n      /* Falls back to the property's initial 0s if sibling-index() isn't\n         recognized: every row then animates in together instead of in\n         sequence, which still looks intentional rather than broken. */\n      animation-delay: calc(sibling-index() * 80ms);\n    }\n  }\n\n  @keyframes reveal {\n    to {\n      opacity: 1;\n      translate: 0 0;\n    }\n  }\n}","js":""},{"id":"css-lab4/04-radial-spokes","lab":"css-lab4","folder":"04-radial-spokes","title":"Radial Spokes","html":"<header>\n  <h1>Radial Spokes</h1>\n  <p>Eight items, evenly spaced around a circle at <code>calc((360deg / sibling-count()) * sibling-index())</code> each. Add or remove an item from the markup and the spacing recomputes on its own, no manual angle math or a synced <code>--count</code> variable to update. Without support for the two functions, this falls back to a plain wrapped row.</p>\n</header>\n\n<div class=\"stage\">\n  <div class=\"ring\">\n    <div class=\"spoke\"><span>01</span></div>\n    <div class=\"spoke\"><span>02</span></div>\n    <div class=\"spoke\"><span>03</span></div>\n    <div class=\"spoke\"><span>04</span></div>\n    <div class=\"spoke\"><span>05</span></div>\n    <div class=\"spoke\"><span>06</span></div>\n    <div class=\"spoke\"><span>07</span></div>\n    <div class=\"spoke\"><span>08</span></div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 250);\n    --color-surface: oklch(21% 0.02 250);\n    --color-text: oklch(96% 0.01 240);\n    --color-muted: oklch(70% 0.02 240);\n    --color-border: oklch(33% 0.02 245);\n    --color-accent: oklch(75% 0.14 225);\n    --stage-bg: oklch(11% 0.02 250);\n    --stage-border: oklch(35% 0.02 245);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n/* Registering --angle as a typed <angle> forces it to resolve on .spoke\n   (using .spoke's real sibling-index()/sibling-count()) before the value\n   inherits down to the label span. Without this, the span would re-run\n   those two functions in its own context when it reads var(--angle), and\n   a span has no siblings of its own, so every label would end up rotated\n   by the same fixed, wrong amount instead of canceling its parent's spin. */\n@property --angle {\n  syntax: \"<angle>\";\n  inherits: true;\n  initial-value: 0deg;\n}\n\n@layer components {\n  /* Base layout: a plain wrapped row. This is what browsers without\n     sibling-index()/sibling-count() see, so the fallback still reads as a\n     deliberate layout rather than a pile of overlapping circles. */\n  .ring {\n    display: flex;\n    flex-wrap: wrap;\n    justify-content: center;\n    gap: .6rem;\n    max-inline-size: 320px;\n    margin-inline: auto;\n  }\n\n  .spoke span {\n    display: grid;\n    place-items: center;\n    inline-size: 2.5rem;\n    block-size: 2.5rem;\n    border-radius: 50%;\n    background: var(--color-accent);\n    color: oklch(15% 0.02 250);\n    font-family: ui-monospace, monospace;\n    font-size: .8rem;\n    font-weight: 700;\n  }\n\n  /* counter-reset takes an <integer>, same type sibling-index() returns, so\n     it doubles as a support test for the function itself. */\n  @supports (counter-reset: c sibling-index()) {\n    .ring {\n      position: relative;\n      inline-size: 280px;\n      block-size: 280px;\n      border-radius: 50%;\n      border: 1px dashed var(--color-border);\n    }\n\n    .spoke {\n      --angle: calc((360deg / sibling-count()) * sibling-index());\n      position: absolute;\n      inset: 0;\n      display: grid;\n      place-items: start center;\n      transform: rotate(var(--angle));\n    }\n\n    .spoke span {\n      margin-block-start: -1.25rem;\n      transform: rotate(calc(var(--angle) * -1));\n    }\n  }\n}","js":""},{"id":"chrome-only-lab/01-customizable-select","lab":"chrome-only-lab","folder":"01-customizable-select","title":"Customizable Select","html":"<header>\n  <h1>Customizable Select</h1>\n  <p>A real <code>&lt;select&gt;</code>, not a JS-built combobox: native keyboard and screen-reader behavior, restyled with CSS via <code>appearance: base-select</code>. The <code>&lt;option&gt;</code>s hold arbitrary HTML (an icon plus a label), and <code>&lt;selectedcontent&gt;</code> mirrors whichever one is picked into the closed button.</p>\n</header>\n\n<div class=\"stage\">\n  <form>\n    <label for=\"channel-select\">Notify me via</label>\n    <select id=\"channel-select\">\n      <button>\n        <selectedcontent></selectedcontent>\n      </button>\n\n      <option value=\"email\" selected>\n        <span class=\"option-icon\" aria-hidden=\"true\">&#9993;&#65039;</span>\n        <span class=\"option-label\">Email</span>\n      </option>\n      <option value=\"sms\">\n        <span class=\"option-icon\" aria-hidden=\"true\">&#128172;</span>\n        <span class=\"option-label\">SMS</span>\n      </option>\n      <option value=\"push\">\n        <span class=\"option-icon\" aria-hidden=\"true\">&#128276;</span>\n        <span class=\"option-label\">Push notification</span>\n      </option>\n      <option value=\"chat\">\n        <span class=\"option-icon\" aria-hidden=\"true\">&#128187;</span>\n        <span class=\"option-label\">Team chat</span>\n      </option>\n    </select>\n  </form>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 70);\n    --color-surface: oklch(21% 0.02 70);\n    --color-text: oklch(96% 0.01 80);\n    --color-muted: oklch(70% 0.02 75);\n    --color-border: oklch(33% 0.02 70);\n    --color-accent: oklch(78% 0.15 70);\n    --stage-bg: oklch(11% 0.02 70);\n    --stage-border: oklch(35% 0.02 70);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .support-banner {\n    padding: .85rem 1rem;\n    margin-block-end: 1.5rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-size: .85rem;\n    line-height: 1.5;\n  }\n\n  .support-banner strong {\n    color: var(--color-text);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  form {\n    display: grid;\n    gap: .5rem;\n    max-inline-size: 20rem;\n  }\n\n  label {\n    font-size: .85rem;\n    color: var(--color-muted);\n  }\n\n  /* Opt in on both the select and its popup picker. Unsupported browsers\n     ignore this declaration entirely and fall back to a plain native\n     select, still fully functional, just unstyled. */\n  select,\n  ::picker(select) {\n    appearance: base-select;\n  }\n\n  select {\n    padding: .65rem .9rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    font-size: 1rem;\n    transition: border-color .2s ease, background .2s ease;\n  }\n\n  select:hover {\n    border-color: var(--color-accent);\n  }\n\n  select::picker-icon {\n    color: var(--color-muted);\n    transition: rotate .2s ease;\n  }\n\n  select:open::picker-icon {\n    rotate: 180deg;\n  }\n\n  ::picker(select) {\n    margin-block-start: .35rem;\n    padding: .35rem;\n    border: 1px solid var(--color-border);\n    border-radius: .6rem;\n    background: var(--color-surface);\n    box-shadow: 0 12px 28px oklch(0% 0 0 / 45%);\n    opacity: 0;\n    translate: 0 -.35rem;\n    transition: opacity .18s ease, translate .18s ease, overlay .18s ease allow-discrete, display .18s ease allow-discrete;\n  }\n\n  :open::picker(select) {\n    opacity: 1;\n    translate: 0 0;\n  }\n\n  @starting-style {\n    :open::picker(select) {\n      opacity: 0;\n      translate: 0 -.35rem;\n    }\n  }\n\n  option {\n    display: flex;\n    align-items: center;\n    gap: .6rem;\n    padding: .55rem .7rem;\n    border-radius: .4rem;\n    color: var(--color-text);\n  }\n\n  option:hover,\n  option:focus-visible {\n    background: color-mix(in oklch, var(--color-accent) 18%, transparent);\n  }\n\n  option:checked {\n    font-weight: 600;\n  }\n\n  option::checkmark {\n    order: 1;\n    margin-inline-start: auto;\n    color: var(--color-accent);\n    content: \"\\2713\";\n  }\n\n  .option-icon {\n    font-size: 1.1rem;\n  }\n\n  /* The closed button mirrors an <option>'s full content via\n     <selectedcontent>, icon included; hiding it there keeps the closed\n     button to just the label, matching a plain select's look. */\n  selectedcontent .option-icon {\n    display: none;\n  }\n}","js":""},{"id":"chrome-only-lab/02-typed-attr","lab":"chrome-only-lab","folder":"02-typed-attr","title":"Typed attr()","html":"<header>\n  <h1>Typed attr()</h1>\n  <p>Each row's accent color and load bar come straight from <code>data-accent</code>/<code>data-load</code> HTML attributes via <code>attr(data-accent type(&lt;color&gt;))</code>, no class per row, no inline <code>style</code>, no JavaScript reading the DOM. <code>attr()</code> only ever reads from the exact element it's declared on though, never an ancestor, so the border and the fill bar (two different elements) each carry their own copy of the same two attributes. The percent label is generated the same way, but with plain untyped <code>attr()</code> in <code>content</code>, the one form of <code>attr()</code> that's always worked everywhere. Typed <code>attr()</code> on other properties is Chrome/Edge-only right now, so every row also has a flat fallback color declared first.</p>\n</header>\n\n<div class=\"stage\">\n  <ul class=\"server-list\">\n    <li class=\"server-card\" data-accent=\"oklch(70% 0.19 25)\" data-load=\"88%\">\n      <span class=\"server-name\">api-prod-1</span>\n      <span class=\"server-load-track\"><span class=\"server-load-fill\" data-accent=\"oklch(70% 0.19 25)\" data-load=\"88%\"></span></span>\n    </li>\n    <li class=\"server-card\" data-accent=\"oklch(78% 0.15 70)\" data-load=\"54%\">\n      <span class=\"server-name\">api-prod-2</span>\n      <span class=\"server-load-track\"><span class=\"server-load-fill\" data-accent=\"oklch(78% 0.15 70)\" data-load=\"54%\"></span></span>\n    </li>\n    <li class=\"server-card\" data-accent=\"oklch(75% 0.14 225)\" data-load=\"31%\">\n      <span class=\"server-name\">worker-queue-1</span>\n      <span class=\"server-load-track\"><span class=\"server-load-fill\" data-accent=\"oklch(75% 0.14 225)\" data-load=\"31%\"></span></span>\n    </li>\n    <li class=\"server-card\" data-accent=\"oklch(72% 0.17 150)\" data-load=\"12%\">\n      <span class=\"server-name\">cache-1</span>\n      <span class=\"server-load-track\"><span class=\"server-load-fill\" data-accent=\"oklch(72% 0.17 150)\" data-load=\"12%\"></span></span>\n    </li>\n  </ul>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 70);\n    --color-surface: oklch(21% 0.02 70);\n    --color-text: oklch(96% 0.01 80);\n    --color-muted: oklch(70% 0.02 75);\n    --color-border: oklch(33% 0.02 70);\n    --color-accent: oklch(78% 0.15 70);\n    --stage-bg: oklch(11% 0.02 70);\n    --stage-border: oklch(35% 0.02 70);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .support-banner {\n    padding: .85rem 1rem;\n    margin-block-end: 1.5rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-size: .85rem;\n    line-height: 1.5;\n  }\n\n  .support-banner strong {\n    color: var(--color-text);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  .server-list {\n    display: grid;\n    gap: .75rem;\n    margin: 0;\n    padding: 0;\n    list-style: none;\n  }\n\n  .server-card {\n    display: grid;\n    grid-template-columns: 10rem 1fr 3rem;\n    align-items: center;\n    gap: 1rem;\n    padding: .9rem 1.1rem;\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-inline-start: 4px solid var(--color-accent);\n    border-radius: .5rem;\n    font-family: ui-monospace, monospace;\n    font-size: .9rem;\n  }\n\n  /* attr() has always been able to read a plain string into content on a\n     pseudo-element, that part is not new. It only reads from the element\n     the pseudo-element itself belongs to, so this has to live on\n     .server-card (which carries data-load), not on a descendant span. */\n  .server-card::after {\n    color: var(--color-muted);\n    font-size: .8rem;\n    text-align: end;\n    content: attr(data-load);\n  }\n\n  .server-load-track {\n    display: block;\n    inline-size: 100%;\n    block-size: .6rem;\n    border-radius: 999px;\n    background: var(--color-bg);\n    overflow: hidden;\n  }\n\n  .server-load-fill {\n    display: block;\n    block-size: 100%;\n    inline-size: 40%;\n    background: var(--color-accent);\n  }\n\n  /* Typed attr() lets the same two data attributes feed the border color\n     and the fill's width and color too, one source of truth in the\n     markup instead of a class per row. */\n  @supports (background: attr(data-accent type(<color>))) {\n    .server-card {\n      border-inline-start-color: attr(data-accent type(<color>));\n    }\n\n    .server-load-fill {\n      inline-size: attr(data-load type(<percentage>));\n      background: attr(data-accent type(<color>));\n    }\n  }\n}","js":""},{"id":"chrome-only-lab/03-geolocation-control","lab":"chrome-only-lab","folder":"03-geolocation-control","title":"Geolocation Element","html":"<header>\n  <h1>Geolocation Element</h1>\n  <p>The browser, not this page's JavaScript, owns the button and the permission prompt: your click on it <em>is</em> the permission signal. This needs a few lines of JS to read the result back out (CSS can't), and it needs a secure context, this will only work served over <code>https://</code> or <code>http://localhost</code>, never opened as a local <code>file://</code> page.</p>\n</header>\n\n<div class=\"stage\">\n  <p id=\"support-note\" class=\"support-banner\">Checking for <code>&lt;geolocation&gt;</code> support&hellip;</p>\n\n  <geolocation class=\"geo-control\">\n    <button id=\"fallback-btn\">Share my location</button>\n  </geolocation>\n\n  <dl class=\"geo-readout\" id=\"geo-readout\" hidden>\n    <div><dt>Latitude</dt><dd id=\"geo-lat\">n/a</dd></div>\n    <div><dt>Longitude</dt><dd id=\"geo-lng\">n/a</dd></div>\n    <div><dt>Accuracy</dt><dd id=\"geo-acc\">n/a</dd></div>\n  </dl>\n\n  <p id=\"geo-error\" class=\"geo-error\" hidden></p>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 70);\n    --color-surface: oklch(21% 0.02 70);\n    --color-text: oklch(96% 0.01 80);\n    --color-muted: oklch(70% 0.02 75);\n    --color-border: oklch(33% 0.02 70);\n    --color-accent: oklch(78% 0.15 70);\n    --stage-bg: oklch(11% 0.02 70);\n    --stage-border: oklch(35% 0.02 70);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .support-banner {\n    padding: .85rem 1rem;\n    margin-block-end: 1.5rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-size: .85rem;\n    line-height: 1.5;\n  }\n\n  .support-banner strong {\n    color: var(--color-text);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  /* geolocation's rendering has forced/clamped values for a handful of\n     properties (opacity locked to 1, line-height to normal, white-space\n     to nowrap, user-select none, plus clamped font-weight/min-height/\n     max-height/border-width/letter-spacing/word-spacing), everything\n     else here is free to style. */\n  .geo-control {\n    display: inline-block;\n    padding: .7rem 1.2rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    font-size: 1rem;\n  }\n\n  .geo-control:hover {\n    border-color: var(--color-accent);\n  }\n\n  /* Plain fallback button for browsers without the element: shown as\n     genuine fallback content only when the browser doesn't recognize\n     <geolocation> at all. */\n  #fallback-btn {\n    padding: .7rem 1.2rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    font: inherit;\n    cursor: pointer;\n  }\n\n  #fallback-btn:hover {\n    border-color: var(--color-accent);\n  }\n\n  .geo-readout {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 1rem;\n    margin: 1.5rem 0 0;\n  }\n\n  /* A declared display always beats the UA stylesheet's [hidden] rule,\n     author-origin styles outrank user-agent ones regardless of\n     specificity, so the hidden attribute needs its own override here or\n     this stays visible the whole time. */\n  .geo-readout[hidden] {\n    display: none;\n  }\n\n  .geo-readout d
