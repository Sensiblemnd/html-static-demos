t {\n    font-size: .75rem;\n    color: var(--color-muted);\n  }\n\n  .geo-readout dd {\n    margin: .2rem 0 0;\n    font-family: ui-monospace, monospace;\n    font-size: .95rem;\n  }\n\n  .geo-error {\n    margin: 1.5rem 0 0;\n    padding: .75rem 1rem;\n    border: 1px solid oklch(65% 0.18 25);\n    border-radius: .5rem;\n    background: oklch(65% 0.18 25 / 12%);\n    color: oklch(85% 0.1 25);\n    font-size: .9rem;\n  }\n}","js":"const supportNote = document.querySelector(\"#support-note\");\nconst readout = document.querySelector(\"#geo-readout\");\nconst errorBox = document.querySelector(\"#geo-error\");\nconst latOut = document.querySelector(\"#geo-lat\");\nconst lngOut = document.querySelector(\"#geo-lng\");\nconst accOut = document.querySelector(\"#geo-acc\");\n\nfunction showPosition(coords) {\n  errorBox.hidden = true;\n  readout.hidden = false;\n  latOut.textContent = coords.latitude.toFixed(4);\n  lngOut.textContent = coords.longitude.toFixed(4);\n  accOut.textContent = `${Math.round(coords.accuracy)}m`;\n}\n\nfunction showError(message) {\n  readout.hidden = true;\n  errorBox.hidden = false;\n  errorBox.textContent = message;\n}\n\nif (typeof HTMLGeolocationElement === \"function\") {\n  supportNote.innerHTML =\n    \"<strong>Supported.</strong> The button below is the browser's own <code>&lt;geolocation&gt;</code> control, not a styled <code>&lt;button&gt;</code>.\";\n\n  const geo = document.querySelector(\"geolocation\");\n  geo.addEventListener(\"location\", () => {\n    if (geo.position) {\n      showPosition(geo.position.coords);\n    } else if (geo.error) {\n      showError(geo.error.message);\n    }\n  });\n} else {\n  supportNote.innerHTML =\n    \"<strong>Not supported here.</strong> Falling back to the classic <code>navigator.geolocation</code> API behind a plain button, this is what every non-Chrome visitor sees, and likely what you see too, since this element is still origin-trial/flag-gated even on Chrome versions that ship it.\";\n\n  document.querySelector(\"#fallback-btn\").addEventListener(\"click\", () => {\n    navigator.geolocation.getCurrentPosition(\n      (position) => showPosition(position.coords),\n      (error) => showError(error.message),\n    );\n  });\n}"},{"id":"chrome-only-lab/04-camera-mic-control","lab":"chrome-only-lab","folder":"04-camera-mic-control","title":"Camera/Mic Element","html":"<header>\n  <h1>Camera/Mic Element</h1>\n  <p><code>&lt;usermedia&gt;</code> is the same idea as the geolocation demo, applied to <code>getUserMedia()</code>: the browser owns the button and the prompt, this page just listens for a <code>stream</code> event and attaches the resulting <code>MediaStream</code> to a preview <code>&lt;video&gt;</code>. Needs a camera/mic, a secure context (<code>https://</code> or <code>http://localhost</code>), and you'll have to actually grant the permission to see the preview.</p>\n</header>\n\n<div class=\"stage\">\n  <p id=\"support-note\" class=\"support-banner\">Checking for <code>&lt;usermedia&gt;</code> support&hellip;</p>\n\n  <usermedia id=\"media-ctrl\" class=\"media-control\">\n    <button id=\"fallback-btn\">Enable camera and microphone</button>\n  </usermedia>\n\n  <video id=\"preview\" class=\"media-preview\" autoplay muted playsinline hidden></video>\n\n  <p id=\"media-error\" class=\"media-error\" hidden></p>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities, overrides;\n\n@layer tokens {\n  :root {\n    color-scheme: dark;\n    --color-bg: oklch(15% 0.02 70);\n    --color-surface: oklch(21% 0.02 70);\n    --color-text: oklch(96% 0.01 80);\n    --color-muted: oklch(70% 0.02 75);\n    --color-border: oklch(33% 0.02 70);\n    --color-accent: oklch(78% 0.15 70);\n    --stage-bg: oklch(11% 0.02 70);\n    --stage-border: oklch(35% 0.02 70);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n    font: 16px system-ui, sans-serif;\n  }\n}\n\n@layer base {\n  html,\n  body {\n    background: var(--color-bg);\n    color: var(--color-text);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-block: 2rem 0;\n    margin-inline: auto;\n    padding-inline: 1rem;\n  }\n\n  header h1 {\n    margin-block-end: .25rem;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-muted);\n    margin-block-start: 0;\n  }\n\n  header p a {\n    color: var(--color-accent);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  :where(a, button, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-text);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .stage {\n    inline-size: min(90vw, 700px);\n    margin-block: 3rem;\n    margin-inline: auto;\n    padding: 2rem 1.5rem;\n    border: 2px dashed var(--stage-border);\n    background: var(--stage-bg);\n  }\n}\n\n@layer components {\n  .support-banner {\n    padding: .85rem 1rem;\n    margin-block-end: 1.5rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-muted);\n    font-size: .85rem;\n    line-height: 1.5;\n  }\n\n  .support-banner strong {\n    color: var(--color-text);\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer components {\n  .media-control {\n    display: inline-block;\n    padding: .7rem 1.2rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    font-size: 1rem;\n  }\n\n  .media-control:hover {\n    border-color: var(--color-accent);\n  }\n\n  #fallback-btn {\n    padding: .7rem 1.2rem;\n    border: 1px solid var(--color-border);\n    border-radius: .5rem;\n    background: var(--color-surface);\n    color: var(--color-text);\n    font: inherit;\n    cursor: pointer;\n  }\n\n  #fallback-btn:hover {\n    border-color: var(--color-accent);\n  }\n\n  .media-preview {\n    display: block;\n    inline-size: 100%;\n    max-inline-size: 24rem;\n    margin: 1.5rem 0 0;\n    border-radius: .5rem;\n    border: 1px solid var(--color-border);\n    background: var(--stage-bg);\n    aspect-ratio: 4 / 3;\n    object-fit: cover;\n  }\n\n  /* Same fix as the geolocation demo: an explicit display always beats\n     the UA stylesheet's [hidden] rule regardless of specificity. */\n  .media-preview[hidden] {\n    display: none;\n  }\n\n  .media-error {\n    margin: 1.5rem 0 0;\n    padding: .75rem 1rem;\n    border: 1px solid oklch(65% 0.18 25);\n    border-radius: .5rem;\n    background: oklch(65% 0.18 25 / 12%);\n    color: oklch(85% 0.1 25);\n    font-size: .9rem;\n  }\n}","js":"const supportNote = document.querySelector(\"#support-note\");\nconst preview = document.querySelector(\"#preview\");\nconst errorBox = document.querySelector(\"#media-error\");\n\nfunction showStream(stream) {\n  errorBox.hidden = true;\n  preview.hidden = false;\n  preview.srcObject = stream;\n}\n\nfunction showError(name) {\n  preview.hidden = true;\n  errorBox.hidden = false;\n  errorBox.textContent = `Couldn't get camera/mic access: ${name}`;\n}\n\nif (typeof HTMLUserMediaElement === \"function\") {\n  supportNote.innerHTML =\n    \"<strong>Supported.</strong> The button below is the browser's own <code>&lt;usermedia&gt;</code> control, not a styled <code>&lt;button&gt;</code>.\";\n\n  const media = document.querySelector(\"#media-ctrl\");\n  media.addEventListener(\"stream\", () => {\n    showStream(media.stream);\n  });\n  media.addEventListener(\"error\", () => {\n    showError(media.error?.name ?? \"unknown error\");\n  });\n} else {\n  supportNote.innerHTML =\n    \"<strong>Not supported here.</strong> Falling back to the classic <code>navigator.mediaDevices.getUserMedia()</code> API behind a plain button, this is what every non-Chrome visitor sees, and likely what you see too, since this element is still origin-trial/flag-gated even on Chrome versions that ship it.\";\n\n  document.querySelector(\"#fallback-btn\").addEventListener(\"click\", async () => {\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });\n      showStream(stream);\n    } catch (error) {\n      showError(error.name);\n    }\n  });\n}"},{"id":"timeline-grid-lab/01-overlapping-events","lab":"timeline-grid-lab","folder":"01-overlapping-events","title":"Overlapping Events","html":"<header>\n  <h1>Overlapping Events</h1>\n  <p>Same subgrid timeline as the base demo, but a row can now hold concurrent events. Each block gets a <code>--lane</code>; <code>.row-data</code> turns into its own <code>repeat(var(--lanes), …)</code> row grid, so the row's height grows to fit however many events overlap.</p>\n</header>\n<div class=\"timeline-scroll-container\">\n  <div class=\"grid-timeline\">\n    <div class=\"header-container\">\n      <div class=\"header-row\">9 AM</div>\n      <div class=\"header-row\">10 AM</div>\n      <div class=\"header-row\">11 AM</div>\n      <div class=\"header-row\">12 PM</div>\n      <div class=\"header-row\">1 PM</div>\n      <div class=\"header-row\">2 PM</div>\n      <div class=\"header-row\">3 PM</div>\n      <div class=\"header-row\">4 PM</div>\n    </div>\n\n    <div class=\"row-label\">Alex</div>\n    <div class=\"row-background\">\n      <div class=\"row-cells\">\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n      </div>\n      <div class=\"row-data\" style=\"--lanes: 1\">\n        <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 3; --lane: 1\">Standup</div>\n      </div>\n    </div>\n\n    <div class=\"row-label\">Sam</div>\n    <div class=\"row-background\">\n      <div class=\"row-cells\">\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n      </div>\n      <div class=\"row-data\" style=\"--lanes: 2\">\n        <div class=\"block\" data-color=\"teal\" style=\"--col-start: 1; --col-end: 3; --lane: 1\">Design Review</div>\n        <div class=\"block\" data-color=\"orange\" style=\"--col-start: 2; --col-end: 4; --lane: 2\">Client Call</div>\n      </div>\n    </div>\n\n    <div class=\"row-label\">Jordan</div>\n    <div class=\"row-background\">\n      <div class=\"row-cells\">\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n        <div class=\"row-cell\"></div>\n      </div>\n      <div class=\"row-data\" style=\"--lanes: 3\">\n        <div class=\"block\" data-color=\"purple\" style=\"--col-start: 5; --col-end: 8; --lane: 1\">Workshop</div>\n        <div class=\"block\" data-color=\"red\" style=\"--col-start: 5; --col-end: 7; --lane: 2\">Interview</div>\n        <div class=\"block\" data-color=\"navy\" style=\"--col-start: 6; --col-end: 8; --lane: 3\">1:1</div>\n      </div>\n    </div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities;\n\n@layer tokens {\n  :root {\n    --gray-97: oklch(97% 0.01 255);\n    --gray-90: oklch(90% 0.01 255);\n    --gray-47: oklch(47% 0 0);\n    --gray-15: oklch(15% 0 0);\n    --gray-100: oklch(100% 0 0);\n\n    --color-page-bg: var(--gray-97);\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-text: var(--gray-15);\n    --color-text-muted: var(--gray-47);\n    --color-on-block: var(--gray-100);\n    --color-accent: oklch(46.519% 0.14455 253.253);\n    --color-focus: var(--color-accent);\n\n    --space-3xs: 0.1875rem;\n    --space-2xs: 0.5rem;\n    --space-xs: 0.625rem;\n    --space-s: 0.9375rem;\n    --space-m: 1.25rem;\n    --space-l: 2rem;\n    --space-xl: 3rem;\n\n    --radius-s: 0.375rem;\n    --radius-m: 0.5rem;\n    --radius-l: 0.75rem;\n\n    --shadow-card: 0 4px 10px oklch(0% 0 0 / 0.05);\n    --shadow-block: 0 2px 4px oklch(0% 0 0 / 0.1);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n  }\n}\n\n@layer base {\n  body {\n    font-family: system-ui, sans-serif;\n    color: var(--color-text);\n    background: var(--color-page-bg);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-inline: auto;\n    padding: var(--space-l) var(--space-m) 0;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-text-muted);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  header a {\n    color: var(--color-accent);\n  }\n\n  code {\n    background: var(--color-border);\n    border-radius: var(--radius-s);\n    padding-inline: var(--space-3xs);\n    font-size: 0.9em;\n  }\n\n  :where(a, button, input, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .index-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));\n    gap: var(--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m s: 20;\n    --size-timeline-min-width: 75rem;\n    --size-row-min-height: 3.125rem;\n    --size-block-height: 2.75rem;\n\n    --row-gap: 15px;\n    --column-gap: 15px;\n\n    --block-opacity: 65%;\n    --block-border: 1px;\n\n    --z-row-background: 1;\n    --z-block: 2;\n    --z-now: 3;\n  }\n}\n\n@layer layout {\n  .timeline-scroll-container {\n    inline-size: 100%;\n    overflow-x: auto;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background: var(--color-surface);\n    box-shadow: var(--shadow-card);\n  }\n\n  .grid-timeline {\n    display: grid;\n    grid-template-columns: repeat(var(--size-timeline-columns), 1fr);\n    min-inline-size: var(--size-timeline-min-width);\n    padding: var(--space-m);\n    grid-auto-rows: minmax(var(--size-row-min-height), auto);\n    row-gap: var(--row-gap);\n    column-gap: var(--column-gap);\n    position: relative;\n  }\n}\n\n@layer components {\n  .header-container {\n    grid-row: 1;\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    border-block-end: 2px solid var(--color-border);\n    border-inline: 1px solid var(--color-border);\n    margin-block-end: var(--space-xs);\n  }\n\n  .header-row {\n    display: grid;\n    place-content: center;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    padding-block-end: var(--space-s);\n    white-space: nowrap;\n  }\n\n  .row-background {\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    block-size: 100%;\n    pointer-events: none;\n    z-index: var(--z-row-background);\n    border-inline: 1px solid var(--color-border);\n  }\n\n  .row-cells {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-data {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-cell {\n    position: relative;\n  }\n\n  .row-cell:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: calc(100% + var(--column-gap) / 2 - 0.5px);\n    inline-size: 1px;\n    background: var(--color-border);\n  }\n\n  .block {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    color: var(--color-on-block);\n    text-align: center;\n    line-height: calc(var(--size-block-height) - 2px);\n    font-weight: bold;\n    font-size: 0.85rem;\n    border-radius: var(--radius-s);\n    background-color: color-mix(\n      in oklch,\n      var(--block-color) var(--block-opacity),\n      transparent\n    );\n    border: var(--block-border) solid var(--block-color);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    z-index: var(--z-block);\n    min-inline-size: 0;\n    block-size: var(--size-block-height);\n    box-shadow: var(--shadow-block);\n    contain: layout style;\n  }\n\n  [data-color=\"blue\"] {\n    --block-color: var(--color-block-blue);\n  }\n  [data-color=\"orange\"] {\n    --block-color: var(--color-block-orange);\n  }\n  [data-color=\"teal\"] {\n    --block-color: var(--color-block-teal);\n  }\n\n  /* wrapper insets the sweep to the grid's content box, excluding its own padding */\n  .now-track {\n    position: absolute;\n    inset-block: 0;\n    inset-inline: var(--space-m);\n    pointer-events: none;\n    z-index: var(--z-now);\n  }\n\n  .now-line {\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: var(--now-position);\n    inline-size: 2px;\n    background: var(--color-now);\n    animation: sweep 16s linear infinite;\n  }\n\n  .now-label {\n    position: absolute;\n    inset-block-start: 0;\n    inset-inline-start: 50%;\n    translate: -50% 0;\n    background: var(--color-now);\n    color: var(--color-on-block);\n    font-size: 0.7rem;\n    font-weight: bold;\n    padding-inline: var(--space-2xs);\n    border-radius: var(--radius-s);\n    white-space: nowrap;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .now-line {\n      animation: none;\n      --now-position: 42%;\n    }\n  }\n}\n\n@keyframes sweep {\n  from {\n    --now-position: 0%;\n  }\n  to {\n    --now-position: 100%;\n  }\n}","js":""},{"id":"timeline-grid-lab/03-density-toggle","lab":"timeline-grid-lab","folder":"03-density-toggle","title":"Density Toggle","html":"<header>\n  <h1>Density Toggle</h1>\n  <p>Three pre-built grids (15/30/60 min columns) swap visibility via the checkbox-hack: hidden radios + <code>:has()</code> on a wrapping element. No JavaScript recomputes anything. Coarser grains just round sub-slot events to the nearest column.</p>\n</header>\n<div class=\"density-switcher-wrap\">\n  <div class=\"density-switcher\" role=\"radiogroup\" aria-label=\"Column density\">\n    <input type=\"radio\" name=\"density\" id=\"density-15\" class=\"visually-hidden\">\n    <label for=\"density-15\">15 min</label>\n    <input type=\"radio\" name=\"density\" id=\"density-30\" class=\"visually-hidden\" checked>\n    <label for=\"density-30\">30 min</label>\n    <input type=\"radio\" name=\"density\" id=\"density-60\" class=\"visually-hidden\">\n    <label for=\"density-60\">Hourly</label>\n  </div>\n\n  <div class=\"timeline-scroll-container\" data-density=\"15\">\n    <div class=\"grid-timeline\">\n      <div class=\"header-container\">\n        <div class=\"header-row\">9:00</div><div class=\"header-row\">9:15</div>\n        <div class=\"header-row\">9:30</div><div class=\"header-row\">9:45</div>\n        <div class=\"header-row\">10:00</div><div class=\"header-row\">10:15</div>\n        <div class=\"header-row\">10:30</div><div class=\"header-row\">10:45</div>\n        <div class=\"header-row\">11:00</div><div class=\"header-row\">11:15</div>\n        <div class=\"header-row\">11:30</div><div class=\"header-row\">11:45</div>\n        <div class=\"header-row\">12:00</div><div class=\"header-row\">12:15</div>\n        <div class=\"header-row\">12:30</div><div class=\"header-row\">12:45</div>\n      </div>\n      <div class=\"row-background\">\n        <div class=\"row-cells\">\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n        </div>\n        <div class=\"row-data\">\n          <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 3\">Team Sync</div>\n          <div class=\"block\" data-color=\"teal\" style=\"--col-start: 3; --col-end: 7\">Focus Block</div>\n          <div class=\"block\" data-color=\"orange\" style=\"--col-start: 13; --col-end: 15\">Lunch Prep</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"timeline-scroll-container\" data-density=\"30\">\n    <div class=\"grid-timeline\">\n      <div class=\"header-container\">\n        <div class=\"header-row\">9:00</div><div class=\"header-row\">9:30</div>\n        <div class=\"header-row\">10:00</div><div class=\"header-row\">10:30</div>\n        <div class=\"header-row\">11:00</div><div class=\"header-row\">11:30</div>\n        <div class=\"header-row\">12:00</div><div class=\"header-row\">12:30</div>\n      </div>\n      <div class=\"row-background\">\n        <div class=\"row-cells\">\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n        </div>\n        <div class=\"row-data\">\n          <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 2\">Team Sync</div>\n          <div class=\"block\" data-color=\"teal\" style=\"--col-start: 2; --col-end: 4\">Focus Block</div>\n          <div class=\"block\" data-color=\"orange\" style=\"--col-start: 7; --col-end: 8\">Lunch Prep</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"timeline-scroll-container\" data-density=\"60\">\n    <div class=\"grid-timeline\">\n      <div class=\"header-container\">\n        <div class=\"header-row\">9 AM</div><div class=\"header-row\">10 AM</div>\n        <div class=\"header-row\">11 AM</div><div class=\"header-row\">12 PM</div>\n      </div>\n      <div class=\"row-background\">\n        <div class=\"row-cells\">\n          <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n        </div>\n        <div class=\"row-data\">\n          <div class=\"block\" data-color=\"teal\" style=\"--col-start: 1; --col-end: 3\">Morning Meetings</div>\n          <div class=\"block\" data-color=\"orange\" style=\"--col-start: 4; --col-end: 5\">Lunch Prep</div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities;\n\n@layer tokens {\n  :root {\n    --gray-97: oklch(97% 0.01 255);\n    --gray-90: oklch(90% 0.01 255);\n    --gray-47: oklch(47% 0 0);\n    --gray-15: oklch(15% 0 0);\n    --gray-100: oklch(100% 0 0);\n\n    --color-page-bg: var(--gray-97);\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-text: var(--gray-15);\n    --color-text-muted: var(--gray-47);\n    --color-on-block: var(--gray-100);\n    --color-accent: oklch(46.519% 0.14455 253.253);\n    --color-focus: var(--color-accent);\n\n    --space-3xs: 0.1875rem;\n    --space-2xs: 0.5rem;\n    --space-xs: 0.625rem;\n    --space-s: 0.9375rem;\n    --space-m: 1.25rem;\n    --space-l: 2rem;\n    --space-xl: 3rem;\n\n    --radius-s: 0.375rem;\n    --radius-m: 0.5rem;\n    --radius-l: 0.75rem;\n\n    --shadow-card: 0 4px 10px oklch(0% 0 0 / 0.05);\n    --shadow-block: 0 2px 4px oklch(0% 0 0 / 0.1);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n  }\n}\n\n@layer base {\n  body {\n    font-family: system-ui, sans-serif;\n    color: var(--color-text);\n    background: var(--color-page-bg);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-inline: auto;\n    padding: var(--space-l) var(--space-m) 0;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-text-muted);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  header a {\n    color: var(--color-accent);\n  }\n\n  code {\n    background: var(--color-border);\n    border-radius: var(--radius-s);\n    padding-inline: var(--space-3xs);\n    font-size: 0.9em;\n  }\n\n  :where(a, button, input, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .index-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));\n    gap: var(--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-l);\n    box-shadow: var(--shadow-card);\n    text-decoration: none;\n    transition: border-color 0.15s ease;\n  }\n\n  .demo-card-link:hover {\n    border-color: var(--color-accent);\n  }\n\n  .demo-num {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n    font-variant-numeric: tabular-nums;\n  }\n\n  .demo-card-link strong {\n    font-size: 1.05rem;\n  }\n\n  .demo-desc {\n    color: var(--color-text-muted);\n    font-size: 0.875rem;\n    line-height: 1.4;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --gray-90: oklch(90% 0.01 255);\n    --gray-100: oklch(100% 0 0);\n\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-on-block: var(--gray-100);\n\n    --color-block-blue: oklch(46.519% 0.14455 253.253);\n    --color-block-orange: oklch(46.52% 0.14822 39.253);\n    --color-block-teal: oklch(43.953% 0.08345 174.247);\n\n    --size-timeline-min-width: 40rem;\n    --size-row-min-height: 3.125rem;\n    --size-block-height: 2.75rem;\n\n    --row-gap: 15px;\n    --column-gap: 15px;\n\n    --block-opacity: 65%;\n    --block-border: 1px;\n\n    --z-row-background: 1;\n    --z-block: 2;\n  }\n}\n\n@layer layout {\n  .density-switcher-wrap {\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    padding-inline: var(--space-m);\n  }\n\n  .density-switcher {\n    display: inline-flex;\n    gap: var(--space-3xs);\n    padding: var(--space-3xs);\n    background: var(--color-border);\n    border-radius: var(--radius-m);\n    margin-block-end: var(--space-m);\n  }\n\n  [data-density] {\n    display: none;\n    inline-size: 100%;\n    overflow-x: auto;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background: var(--color-surface);\n    box-shadow: var(--shadow-card);\n  }\n\n  .density-switcher-wrap:has(#density-15:checked) [data-density=\"15\"],\n  .density-switcher-wrap:has(#density-30:checked) [data-density=\"30\"],\n  .density-switcher-wrap:has(#density-60:checked) [data-density=\"60\"] {\n    display: block;\n  }\n\n  [data-density=\"15\"] .grid-timeline {\n    --size-timeline-columns: 16;\n  }\n  [data-density=\"30\"] .grid-timeline {\n    --size-timeline-columns: 8;\n  }\n  [data-density=\"60\"] .grid-timeline {\n    --size-timeline-columns: 4;\n  }\n\n  .grid-timeline {\n    display: grid;\n    grid-template-columns: repeat(var(--size-timeline-columns), 1fr);\n    min-inline-size: var(--size-timeline-min-width);\n    padding: var(--space-m);\n    grid-auto-rows: minmax(var(--size-row-min-height), auto);\n    row-gap: var(--row-gap);\n    column-gap: var(--column-gap);\n    position: relative;\n  }\n}\n\n@layer components {\n  .density-switcher label {\n    padding: var(--space-3xs) var(--space-s);\n    border-radius: var(--radius-s);\n    font-size: 0.85rem;\n    font-weight: 600;\n    color: var(--color-text-muted);\n    cursor: pointer;\n  }\n\n  .density-switcher input:checked + label {\n    background: var(--color-surface);\n    color: var(--color-text);\n    box-shadow: var(--shadow-block);\n  }\n\n  .density-switcher input:focus-visible + label {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n\n  .header-container {\n    grid-row: 1;\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    border-block-end: 2px solid var(--color-border);\n    border-inline: 1px solid var(--color-border);\n    margin-block-end: var(--space-xs);\n  }\n\n  .header-row {\n    display: grid;\n    place-content: center;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    padding-block-end: var(--space-s);\n    white-space: nowrap;\n  }\n\n  .row-background {\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    block-size: 100%;\n    pointer-events: none;\n    z-index: var(--z-row-background);\n    border-inline: 1px solid var(--color-border);\n  }\n\n  .row-cells {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-data {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-cell {\n    position: relative;\n  }\n\n  .row-cell:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: calc(100% + var(--column-gap) / 2 - 0.5px);\n    inline-size: 1px;\n    background: var(--color-border);\n  }\n\n  .block {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    color: var(--color-on-block);\n    text-align: center;\n    line-height: calc(var(--size-block-height) - 2px);\n    font-weight: bold;\n    font-size: 0.85rem;\n    border-radius: var(--radius-s);\n    background-color: color-mix(\n      in oklch,\n      var(--block-color) var(--block-opacity),\n      transparent\n    );\n    border: var(--block-border) solid var(--block-color);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    z-index: var(--z-block);\n    min-inline-size: 0;\n    block-size: var(--size-block-height);\n    box-shadow: var(--shadow-block);\n    contain: layout style;\n  }\n\n  [data-color=\"blue\"] {\n    --block-color: var(--color-block-blue);\n  }\n  [data-color=\"orange\"] {\n    --block-color: var(--color-block-orange);\n  }\n  [data-color=\"teal\"] {\n    --block-color: var(--color-block-teal);\n  }\n}","js":""},{"id":"timeline-grid-lab/04-dark-mode-toggle","lab":"timeline-grid-lab","folder":"04-dark-mode-toggle","title":"Dark Mode Toggle","html":"<header>\n  <h1>Dark Mode Toggle</h1>\n  <p>Two takes on <code>light-dark()</code>: color tokens are declared once as <code>light-dark(light, dark)</code>, and whichever half applies depends entirely on the <code>color-scheme</code> of the element using them. No gray primitives to override, no custom-property cross-element surprises.</p>\n</header>\n\n<div class=\"theme-lab\">\n  <section class=\"theme-section\">\n    <h2>Auto: follows your system</h2>\n    <p>No toggle here on purpose. This panel only sets <code>color-scheme: light dark</code>; the browser picks based on your OS or browser appearance setting.</p>\n    <div class=\"timeline-scroll-container\">\n      <div class=\"grid-timeline\">\n        <div class=\"header-container\">\n          <div class=\"header-row\">9 AM</div><div class=\"header-row\">10 AM</div>\n          <div class=\"header-row\">11 AM</div><div class=\"header-row\">12 PM</div>\n          <div class=\"header-row\">1 PM</div><div class=\"header-row\">2 PM</div>\n        </div>\n        <div class=\"row-background\">\n          <div class=\"row-cells\">\n            <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n            <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          </div>\n          <div class=\"row-data\">\n            <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 3\">Standup</div>\n            <div class=\"block\" data-color=\"teal\" style=\"--col-start: 3; --col-end: 5\">Design Review</div>\n            <div class=\"block\" data-color=\"orange\" style=\"--col-start: 5; --col-end: 7\">Client Call</div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"theme-section manual-scope\">\n    <h2>Manual override</h2>\n    <p>Radios force <code>color-scheme</code> on this section directly, overriding the system default. The swatch on the right goes further: its <code>background-image</code> is itself a <code>light-dark()</code> pair, gated behind <code>@supports</code> for browsers that don't parse images inside it yet (Safari, as of this writing).</p>\n    <div class=\"mode-switcher\" role=\"radiogroup\" aria-label=\"Theme\">\n      <input type=\"radio\" name=\"mode\" id=\"mode-auto\" class=\"visually-hidden\" checked>\n      <label for=\"mode-auto\">Auto</label>\n      <input type=\"radio\" name=\"mode\" id=\"mode-light\" class=\"visually-hidden\">\n      <label for=\"mode-light\">Light</label>\n      <input type=\"radio\" name=\"mode\" id=\"mode-dark\" class=\"visually-hidden\">\n      <label for=\"mode-dark\">Dark</label>\n    </div>\n    <div class=\"manual-preview\">\n      <div class=\"timeline-scroll-container\">\n        <div class=\"grid-timeline\">\n          <div class=\"header-container\">\n            <div class=\"header-row\">9 AM</div><div class=\"header-row\">10 AM</div>\n            <div class=\"header-row\">11 AM</div><div class=\"header-row\">12 PM</div>\n          </div>\n          <div class=\"row-background\">\n            <div class=\"row-cells\">\n              <div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n              <div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n            </div>\n            <div class=\"row-data\">\n              <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 2\">Standup</div>\n              <div class=\"block\" data-color=\"teal\" style=\"--col-start: 2; --col-end: 4\">Design Review</div>\n            </div>\n          </div>\n        </div>\n      </div>\n      <div class=\"pattern-swatch\">\n        <span class=\"pattern-label\">background-image: light-dark(&hellip;)</span>\n      </div>\n    </div>\n  </section>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities;\n\n@layer tokens {\n  :root {\n    --gray-97: oklch(97% 0.01 255);\n    --gray-90: oklch(90% 0.01 255);\n    --gray-47: oklch(47% 0 0);\n    --gray-15: oklch(15% 0 0);\n    --gray-100: oklch(100% 0 0);\n\n    --color-page-bg: var(--gray-97);\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-text: var(--gray-15);\n    --color-text-muted: var(--gray-47);\n    --color-on-block: var(--gray-100);\n    --color-accent: oklch(46.519% 0.14455 253.253);\n    --color-focus: var(--color-accent);\n\n    --space-3xs: 0.1875rem;\n    --space-2xs: 0.5rem;\n    --space-xs: 0.625rem;\n    --space-s: 0.9375rem;\n    --space-m: 1.25rem;\n    --space-l: 2rem;\n    --space-xl: 3rem;\n\n    --radius-s: 0.375rem;\n    --radius-m: 0.5rem;\n    --radius-l: 0.75rem;\n\n    --shadow-card: 0 4px 10px oklch(0% 0 0 / 0.05);\n    --shadow-block: 0 2px 4px oklch(0% 0 0 / 0.1);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n  }\n}\n\n@layer base {\n  body {\n    font-family: system-ui, sans-serif;\n    color: var(--color-text);\n    background: var(--color-page-bg);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-inline: auto;\n    padding: var(--space-l) var(--space-m) 0;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-text-muted);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  header a {\n    color: var(--color-accent);\n  }\n\n  code {\n    background: var(--color-border);\n    border-radius: var(--radius-s);\n    padding-inline: var(--space-3xs);\n    font-size: 0.9em;\n  }\n\n  :where(a, button, input, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .index-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));\n    gap: var(--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-l);\n    box-shadow: var(--shadow-card);\n    text-decoration: none;\n    transition: border-color 0.15s ease;\n  }\n\n  .demo-card-link:hover {\n    border-color: var(--color-accent);\n  }\n\n  .demo-num {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n    font-variant-numeric: tabular-nums;\n  }\n\n  .demo-card-link strong {\n    font-size: 1.05rem;\n  }\n\n  .demo-desc {\n    color: var(--color-text-muted);\n    font-size: 0.875rem;\n    line-height: 1.4;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  /* light-dark() resolves against the used color-scheme of the element\n     using it, re-evaluated per element, unlike a plain var() reference\n     nested inside another custom property (which bakes in at the element\n     where it's declared). So these can live once on .theme-lab, and a\n     descendant only needs to set its own color-scheme to flip them. */\n  .theme-lab {\n    color-scheme: light dark;\n\n    --color-page-bg: light-dark(oklch(97% 0.01 255), oklch(20% 0 0));\n    --color-surface: light-dark(oklch(100% 0 0), oklch(26% 0.01 255));\n    --color-border: light-dark(oklch(90% 0.01 255), oklch(32% 0 0));\n    --color-text: light-dark(oklch(15% 0 0), oklch(95% 0 0));\n    --color-text-muted: light-dark(oklch(47% 0 0), oklch(68% 0 0));\n    /* always light: block backgrounds stay the same saturated colors in\n       both schemes, so their text shouldn't flip with the surface */\n    --color-on-block: oklch(100% 0 0);\n\n    --color-block-blue: oklch(46.519% 0.14455 253.253);\n    --color-block-orange: oklch(46.52% 0.14822 39.253);\n    --color-block-teal: oklch(43.953% 0.08345 174.247);\n\n    --size-timeline-columns: 6;\n    --size-timeline-min-width: 26rem;\n    --size-row-min-height: 3.125rem;\n    --size-block-height: 2.75rem;\n\n    --row-gap: 15px;\n    --column-gap: 15px;\n\n    --block-opacity: 65%;\n    --block-border: 1px;\n\n    --z-row-background: 1;\n    --z-block: 2;\n  }\n}\n\n@layer layout {\n  .theme-lab {\n    display: grid;\n    gap: var(--space-l);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    padding-inline: var(--space-m);\n  }\n\n  .theme-section {\n    color-scheme: light dark;\n    padding: var(--space-m);\n    border-radius: var(--radius-l);\n    background: var(--color-page-bg);\n    color: var(--color-text);\n    transition:\n      background-color 0.2s ease,\n      color 0.2s ease;\n  }\n\n  .manual-preview {\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: var(--space-m);\n    align-items: stretch;\n  }\n\n  .timeline-scroll-container {\n    inline-size: 100%;\n    overflow-x: auto;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background: var(--color-surface);\n    box-shadow: var(--shadow-card);\n  }\n\n  .grid-timeline {\n    display: grid;\n    grid-template-columns: repeat(var(--size-timeline-columns), 1fr);\n    min-inline-size: var(--size-timeline-min-width);\n    padding: var(--space-m);\n    grid-auto-rows: minmax(var(--size-row-min-height), auto);\n    row-gap: var(--row-gap);\n    column-gap: var(--column-gap);\n    position: relative;\n  }\n}\n\n@layer components {\n  .theme-section h2 {\n    margin-block-start: 0;\n    font-size: 1.1rem;\n  }\n\n  .theme-section p {\n    color: var(--color-text-muted);\n    font-size: 0.9rem;\n  }\n\n  /* the radios force this section's color-scheme, which every light-dark()\n     token declared on .theme-lab re-resolves against automatically */\n  .manual-scope:has(#mode-light:checked) {\n    color-scheme: light;\n  }\n  .manual-scope:has(#mode-dark:checked) {\n    color-scheme: dark;\n  }\n\n  .mode-switcher {\n    display: inline-flex;\n    gap: var(--space-3xs);\n    padding: var(--space-3xs);\n    background: var(--color-border);\n    border-radius: var(--radius-m);\n    margin-block: var(--space-s);\n  }\n\n  .mode-switcher label {\n    padding: var(--space-3xs) var(--space-s);\n    border-radius: var(--radius-s);\n    font-size: 0.85rem;\n    font-weight: 600;\n    color: var(--color-text-muted);\n    cursor: pointer;\n  }\n\n  .mode-switcher input:checked + label {\n    background: var(--color-surface);\n    color: var(--color-text);\n    box-shadow: var(--shadow-block);\n  }\n\n  .mode-switcher input:focus-visible + label {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n\n  .pattern-swatch {\n    position: relative;\n    display: flex;\n    align-items: flex-end;\n    min-inline-size: 8rem;\n    padding: var(--space-2xs);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background-color: var(--color-surface);\n  }\n\n  @supports (background-image: light-dark(none, none)) {\n    .pattern-swatch {\n      background-image: light-dark(\n        repeating-linear-gradient(\n          45deg,\n          oklch(94% 0 0) 0 8px,\n          oklch(90% 0 0) 8px 16px\n        ),\n        repeating-linear-gradient(\n          45deg,\n          oklch(30% 0 0) 0 8px,\n          oklch(24% 0 0) 8px 16px\n        )\n      );\n    }\n  }\n\n  .pattern-label {\n    background: var(--color-surface);\n    color: var(--color-text-muted);\n    font-size: 0.65rem;\n    padding: var(--space-3xs) var(--space-2xs);\n    border-radius: var(--radius-s);\n  }\n\n  .header-container {\n    grid-row: 1;\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    border-block-end: 2px solid var(--color-border);\n    border-inline: 1px solid var(--color-border);\n    margin-block-end: var(--space-xs);\n  }\n\n  .header-row {\n    display: grid;\n    place-content: center;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    padding-block-end: var(--space-s);\n    white-space: nowrap;\n  }\n\n  .row-background {\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    block-size: 100%;\n    pointer-events: none;\n    z-index: var(--z-row-background);\n    border-inline: 1px solid var(--color-border);\n  }\n\n  .row-cells {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-data {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-cell {\n    position: relative;\n  }\n\n  .row-cell:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: calc(100% + var(--column-gap) / 2 - 0.5px);\n    inline-size: 1px;\n    background: var(--color-border);\n  }\n\n  .block {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    color: var(--color-on-block);\n    text-align: center;\n    line-height: calc(var(--size-block-height) - 2px);\n    font-weight: bold;\n    font-size: 0.85rem;\n    border-radius: var(--radius-s);\n    background-color: color-mix(\n      in oklch,\n      var(--block-color) var(--block-opacity),\n      transparent\n    );\n    border: var(--block-border) solid var(--block-color);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    z-index: var(--z-block);\n    min-inline-size: 0;\n    block-size: var(--size-block-height);\n    box-shadow: var(--shadow-block);\n    contain: layout style;\n  }\n\n  [data-color=\"blue\"] {\n    --block-color: var(--color-block-blue);\n  }\n  [data-color=\"orange\"] {\n    --block-color: var(--color-block-orange);\n  }\n  [data-color=\"teal\"] {\n    --block-color: var(--color-block-teal);\n  }\n}","js":""},{"id":"timeline-grid-lab/05-responsive-agenda","lab":"timeline-grid-lab","folder":"05-responsive-agenda","title":"Responsive Agenda","html":"<header>\n  <h1>Responsive Agenda</h1>\n  <p>A container query collapses the grid into a stacked agenda list once its container gets narrow. Drag the handle in the corner below to resize it (native CSS <code>resize</code>, no JavaScript involved in reading the size).</p>\n</header>\n<div class=\"resize-demo\">\n  <div class=\"agenda-container\">\n    <div class=\"timeline-scroll-container\">\n      <div class=\"grid-timeline\">\n        <div class=\"header-container\">\n          <div class=\"header-row\">9 AM</div><div class=\"header-row\">10 AM</div>\n          <div class=\"header-row\">11 AM</div><div class=\"header-row\">12 PM</div>\n          <div class=\"header-row\">1 PM</div><div class=\"header-row\">2 PM</div>\n        </div>\n        <div class=\"row-background\">\n          <div class=\"row-cells\">\n            <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n            <div class=\"row-cell\"></div><div class=\"row-cell\"></div><div class=\"row-cell\"></div>\n          </div>\n          <div class=\"row-data\">\n            <div class=\"block\" data-color=\"blue\" style=\"--col-start: 1; --col-end: 2\">Standup</div>\n            <div class=\"block\" data-color=\"teal\" style=\"--col-start: 2; --col-end: 4\">Design Review</div>\n            <div class=\"block\" data-color=\"orange\" style=\"--col-start: 4; --col-end: 7\">Client Workshop</div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <ul class=\"agenda-list\">\n      <li class=\"agenda-item\" data-color=\"blue\">\n        <span class=\"agenda-time\">9:00 – 10:00</span>\n        <span class=\"agenda-title\">Standup</span>\n      </li>\n      <li class=\"agenda-item\" data-color=\"teal\">\n        <span class=\"agenda-time\">10:00 – 11:00</span>\n        <span class=\"agenda-title\">Design Review</span>\n      </li>\n      <li class=\"agenda-item\" data-color=\"orange\">\n        <span class=\"agenda-time\">11:00 – 2:00</span>\n        <span class=\"agenda-title\">Client Workshop</span>\n      </li>\n    </ul>\n  </div>\n</di (--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-l);\n    box-shadow: var(--shadow-card);\n    text-decoration: none;\n    transition: border-color 0.15s ease;\n  }\n\n  .demo-card-link:hover {\n    border-color: var(--color-accent);\n  }\n\n  .demo-num {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n    font-variant-numeric: tabular-nums;\n  }\n\n  .demo-card-link strong {\n    font-size: 1.05rem;\n  }\n\n  .demo-desc {\n    color: var(--color-text-muted);\n    font-size: 0.875rem;\n    line-height: 1.4;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --gray-90: oklch(90% 0.01 255);\n    --gray-100: oklch(100% 0 0);\n\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-on-block: var(--gray-100);\n\n    --color-block-blue: oklch(46.519% 0.14455 253.253);\n    --color-block-orange: oklch(46.52% 0.14822 39.253);\n    --color-block-teal: oklch(43.953% 0.08345 174.247);\n\n    --size-timeline-columns: 6;\n    --size-timeline-min-width: 30rem;\n    --size-row-min-height: 3.125rem;\n    --size-block-height: 2.75rem;\n\n    --row-gap: 15px;\n    --column-gap: 15px;\n\n    --block-opacity: 65%;\n    --block-border: 1px;\n\n    --z-row-background: 1;\n    --z-block: 2;\n  }\n}\n\n@layer layout {\n  .resize-demo {\n    inline-size: min(100%, 45rem);\n    min-inline-size: 14rem;\n    max-inline-size: 60rem;\n    margin-inline: auto;\n    resize: horizontal;\n    overflow: auto;\n    padding: var(--space-m);\n    border: 2px dashed var(--color-border);\n    border-radius: var(--radius-l);\n  }\n\n  .agenda-container {\n    container-type: inline-size;\n    container-name: agenda;\n    inline-size: 100%;\n  }\n\n  .agenda-list {\n    display: none;\n    list-style: none;\n    margin: 0;\n    padding: 0;\n    flex-direction: column;\n    gap: var(--space-2xs);\n  }\n\n  .timeline-scroll-container {\n    inline-size: 100%;\n    overflow-x: auto;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background: var(--color-surface);\n    box-shadow: var(--shadow-card);\n  }\n\n  .grid-timeline {\n    display: grid;\n    grid-template-columns: repeat(var(--size-timeline-columns), 1fr);\n    min-inline-size: var(--size-timeline-min-width);\n    padding: var(--space-m);\n    grid-auto-rows: minmax(var(--size-row-min-height), auto);\n    row-gap: var(--row-gap);\n    column-gap: var(--column-gap);\n    position: relative;\n  }\n\n  /* below this container width, the grid stops being readable, so\n     swap it for a stacked list instead of shrinking columns further */\n  @container agenda (max-width: 28rem) {\n    .timeline-scroll-container {\n      display: none;\n    }\n\n    .agenda-list {\n      display: flex;\n    }\n  }\n}\n\n@layer components {\n  .header-container {\n    grid-row: 1;\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    border-block-end: 2px solid var(--color-border);\n    border-inline: 1px solid var(--color-border);\n    margin-block-end: var(--space-xs);\n  }\n\n  .header-row {\n    display: grid;\n    place-content: center;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    padding-block-end: var(--space-s);\n  }\n\n  .row-background {\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    block-size: 100%;\n    pointer-events: none;\n    z-index: var(--z-row-background);\n    border-inline: 1px solid var(--color-border);\n  }\n\n  .row-cells {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-data {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-cell {\n    position: relative;\n  }\n\n  .row-cell:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: calc(100% + var(--column-gap) / 2 - 0.5px);\n    inline-size: 1px;\n    background: var(--color-border);\n  }\n\n  .block {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    color: var(--color-on-block);\n    text-align: center;\n    line-height: calc(var(--size-block-height) - 2px);\n    font-weight: bold;\n    font-size: 0.85rem;\n    border-radius: var(--radius-s);\n    background-color: color-mix(\n      in oklch,\n      var(--block-color) var(--block-opacity),\n      transparent\n    );\n    border: var(--block-border) solid var(--block-color);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    z-index: var(--z-block);\n    min-inline-size: 0;\n    block-size: var(--size-block-height);\n    box-shadow: var(--shadow-block);\n    contain: layout style;\n  }\n\n  .agenda-item {\n    display: flex;\n    flex-direction: column;\n    gap: var(--space-3xs);\n    padding: var(--space-2xs) var(--space-s);\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-inline-start: 4px solid var(--block-color);\n    border-radius: var(--radius-s);\n  }\n\n  .agenda-time {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n  }\n\n  .agenda-title {\n    font-weight: bold;\n  }\n\n  [data-color=\"blue\"] {\n    --bloc     color: var(--color-accent);\n  }\n\n  code {\n    background: var(--color-border);\n    border-radius: var(--radius-s);\n    padding-inline: var(--space-3xs);\n    font-size: 0.9em;\n  }\n\n  :where(a, button, input, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .index-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));\n    gap: var(--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-l);\n    box-shadow: var(--shadow-card);\n    text-decoration: none;\n    transition: border-color 0.15s ease;\n  }\n\n  .demo-card-link:hover {\n    border-color: var(--color-accent);\n  }\n\n  .demo-num {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n    font-variant-numeric: tabular-nums;\n  }\n\n  .demo-card-link strong {\n    font-size: 1.05rem;\n  }\n\n  .demo-desc {\n    color: var(--color-text-muted);\n    font-size: 0.875rem;\n    line-height: 1.4;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --gray-90: oklch(90% 0.01 255);\n    --gray-100: oklch(100% 0 0);\n\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-on-block: var(--gray-100);\n\n    --color-block-sky: oklch(48.061% 0.11146 240.717);\n    --color-block-purple: oklch(43.955% 0.16086 319.846);\n    --color-block-blue: oklch(46.519% 0.14455 253.253);\n    --color-block-teal: oklch(43.953% 0.08345 174.247);\n    --color-milestone: oklch(46.271% 0.18781 25.465);\n\n    --size-timeline-columns: 14;\n    --size-timeline-min-width: 55rem;\n    --size-row-min-height: 3.125rem;\n    --size-block-height: 2.75rem;\n\n    --row-gap: 15px;\n    --column-gap: 15px;\n\n    --block-opacity: 65%;\n    --block-border: 1px;\n\n    --z-row-background: 1;\n    --z-block: 2;\n  }\n}\n\n@layer layout {\n  .timeline-scroll-container {\n    inline-size: 100%;\n    overflow-x: auto;\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    background: var(--color-surface);\n    box-shadow: var(--shadow-card);\n  }\n\n  .grid-timeline {\n    display: grid;\n    grid-template-columns: repeat(var(--size-timeline-columns), 1fr);\n    min-inline-size: var(--size-timeline-min-width);\n    padding: var(--space-m);\n    grid-auto-rows: minmax(var(--size-row-min-height), auto);\n    row-gap: var(--row-gap);\n    column-gap: var(--column-gap);\n    position: relative;\n  }\n}\n\n@layer components {\n  .header-container {\n    grid-row: 1;\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    border-block-end: 2px solid var(--color-border);\n    border-inline: 1px solid var(--color-border);\n    margin-block-end: var(--space-xs);\n  }\n\n  .header-row {\n    display: grid;\n    place-content: center;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    padding-block-end: var(--space-s);\n    white-space: nowrap;\n  }\n\n  .row-label {\n    grid-column: 1 / -1;\n    font-weight: 600;\n    font-size: 0.85rem;\n    color: var(--color-text-muted);\n    margin-block-end: calc(-1 * var(--space-2xs));\n  }\n\n  .row-background {\n    grid-column: 1 / -1;\n    display: grid;\n    grid-template-columns: subgrid;\n    block-size: 100%;\n    pointer-events: none;\n    z-index: var(--z-row-background);\n    border-inline: 1px solid var(--color-border);\n  }\n\n  .row-cells {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-data {\n    display: grid;\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    column-gap: var(--column-gap);\n    grid-template-columns: subgrid;\n  }\n\n  .row-cell {\n    position: relative;\n  }\n\n  .row-cell:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    inset-block: 0;\n    inset-inline-start: calc(100% + var(--column-gap) / 2 - 0.5px);\n    inline-size: 1px;\n    background: var(--color-border);\n  }\n\n  .block {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    color: var(--color-on-block);\n    text-align: center;\n    line-height: calc(var(--size-block-height) - 2px);\n    font-weight: bold;\n    font-size: 0.85rem;\n    border-radius: var(--radius-s);\n    background-color: color-mix(\n      in oklch,\n      var(--block-color) var(--block-opacity),\n      transparent\n    );\n    border: var(--block-border) solid var(--block-color);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    z-index: var(--z-block);\n    min-inline-size: 0;\n    block-size: var(--size-block-height);\n    box-shadow: var(--shadow-block);\n    contain: layout style;\n  }\n\n  .milestone {\n    grid-column-start: var(--col-start, 1);\n    grid-column-end: var(--col-end, 2);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: var(--space-3xs);\n    z-index: var(--z-block);\n  }\n\n  .milestone-diamond {\n    inline-size: 1rem;\n    block-size: 1rem;\n    background: var(--color-milestone);\n    rotate: 45deg;\n    box-shadow: var(--shadow-block);\n    flex-shrink: 0;\n  }\n\n  .milestone-label {\n    font-size: 0.7rem;\n    font-weight: bold;\n    color: var(--color-text-muted);\n    w iv>\n        <div class=\"day-cell\" data-level=\"3\" title=\"Apr 16: 9 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"Apr 17: 2 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"Apr 18: 3 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"Apr 19: 4 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"3\" title=\"Apr 20: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"Apr 21: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"Apr 22: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"Apr 23: 3 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"Apr 24: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"Apr 25: 1 contribution\"></div>\n        <div class=\"day-cell\" data-level=\"3\" title=\"Apr 26: 3 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"Apr 27: 1 contribution\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"Apr 28: 2 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"1\" title=\"May 1: 2 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 2: 2 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 3: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"4\" title=\"May 4: 12 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 5: 2 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"3\" title=\"May 6: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"May 7: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"May 8: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 9: 4 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 10: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"May 11: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"2\" title=\"May 12: 6 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"May 13: 0 contributions\"></div>\n        <div class=\"day-cell\" data-level=\"0\" title=\"May 14: 0 contributions\"></div>\n      </div>\n</div>\n<div class=\"heatmap-legend\">\n  <span>Less</span>\n  <span class=\"legend-swatch\" data-level=\"0\"></span>\n  <span class=\"legend-swatch\" data-level=\"1\"></span>\n  <span class=\"legend-swatch\" data-level=\"2\"></span>\n  <span class=\"legend-swatch\" data-level=\"3\"></span>\n  <span class=\"legend-swatch\" data-level=\"4\"></span>\n  <span>More</span>\n</div>","css":"@layer reset, tokens, base, layout, components, utilities;\n\n@layer tokens {\n  :root {\n    --gray-97: oklch(97% 0.01 255);\n    --gray-90: oklch(90% 0.01 255);\n    --gray-47: oklch(47% 0 0);\n    --gray-15: oklch(15% 0 0);\n    --gray-100: oklch(100% 0 0);\n\n    --color-page-bg: var(--gray-97);\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n    --color-text: var(--gray-15);\n    --color-text-muted: var(--gray-47);\n    --color-on-block: var(--gray-100);\n    --color-accent: oklch(46.519% 0.14455 253.253);\n    --color-focus: var(--color-accent);\n\n    --space-3xs: 0.1875rem;\n    --space-2xs: 0.5rem;\n    --space-xs: 0.625rem;\n    --space-s: 0.9375rem;\n    --space-m: 1.25rem;\n    --space-l: 2rem;\n    --space-xl: 3rem;\n\n    --radius-s: 0.375rem;\n    --radius-m: 0.5rem;\n    --radius-l: 0.75rem;\n\n    --shadow-card: 0 4px 10px oklch(0% 0 0 / 0.05);\n    --shadow-block: 0 2px 4px oklch(0% 0 0 / 0.1);\n  }\n}\n\n@layer reset {\n  * {\n    box-sizing: border-box;\n  }\n\n  body {\n    margin: 0;\n  }\n}\n\n@layer base {\n  body {\n    font-family: system-ui, sans-serif;\n    color: var(--color-text);\n    background: var(--color-page-bg);\n  }\n\n  header {\n    max-inline-size: 900px;\n    margin-inline: auto;\n    padding: var(--space-l) var(--space-m) 0;\n  }\n\n  header p {\n    max-inline-size: 70ch;\n    color: var(--color-text-muted);\n  }\n\n  :is(h1, h2, h3) {\n    text-wrap: balance;\n  }\n\n  p {\n    text-wrap: pretty;\n  }\n\n  header a {\n    color: var(--color-accent);\n  }\n\n  code {\n    background: var(--color-border);\n    border-radius: var(--radius-s);\n    padding-inline: var(--space-3xs);\n    font-size: 0.9em;\n  }\n\n  :where(a, button, input, [tabindex]):focus-visible {\n    outline: 2px solid var(--color-focus);\n    outline-offset: 2px;\n  }\n}\n\n@layer layout {\n  .index-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));\n    gap: var(--space-m);\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block: var(--space-l) var(--space-xl);\n    padding-inline: var(--space-m);\n  }\n}\n\n@layer components {\n  .demo-card-link {\n    display: grid;\n    align-content: start;\n    gap: var(--space-2xs);\n    padding: var(--space-m);\n    background: var(--color-surface);\n    color: var(--color-text);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-l);\n    box-shadow: var(--shadow-card);\n    text-decoration: none;\n    transition: border-color 0.15s ease;\n  }\n\n  .demo-card-link:hover {\n    border-color: var(--color-accent);\n  }\n\n  .demo-num {\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n    font-variant-numeric: tabular-nums;\n  }\n\n  .demo-card-link strong {\n    font-size: 1.05rem;\n  }\n\n  .demo-desc {\n    color: var(--color-text-muted);\n    font-size: 0.875rem;\n    line-height: 1.4;\n  }\n}\n\n@layer utilities {\n  .visually-hidden {\n    position: absolute;\n    inline-size: 1px;\n    block-size: 1px;\n    padding: 0;\n    margin: -1px;\n    overflow: hidden;\n    clip-path: inset(50%);\n    white-space: nowrap;\n    border: 0;\n  }\n}\n\n@layer tokens {\n  :root {\n    --gray-90: oklch(90% 0.01 255);\n    --gray-100: oklch(100% 0 0);\n\n    --color-surface: var(--gray-100);\n    --color-border: var(--gray-90);\n\n    --color-level-0: var(--gray-90);\n    --color-level-1: oklch(84% 0.09 145);\n    --color-level-2: oklch(70% 0.13 145);\n    --color-level-3: oklch(56% 0.15 145);\n    --color-level-4: oklch(42% 0.15 145);\n\n    --cell-size: 0.75rem;\n    --cell-gap: 0.2rem;\n  }\n}\n\n@layer layout {\n  .heatmap-scroll-container {\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    overflow-x: auto;\n    padding: var(--space-m);\n    background: var(--color-surface);\n    border: 1px solid var(--color-border);\n    border-radius: var(--radius-m);\n    box-shadow: var(--shadow-card);\n  }\n\n  .heatmap-grid {\n    display: grid;\n    grid-template-rows: repeat(7, var(--cell-size));\n    grid-auto-flow: column;\n    grid-auto-columns: var(--cell-size);\n    gap: var(--cell-gap);\n    width: max-content;\n  }\n\n  .heatmap-legend {\n    display: flex;\n    align-items: center;\n    gap: var(--space-3xs);\n    justify-content: flex-end;\n    max-inline-size: 1100px;\n    margin-inline: auto;\n    margin-block-start: var(--space-2xs);\n    padding-inline: var(--space-m);\n    font-size: 0.75rem;\n    color: var(--color-text-muted);\n  }\n}\n\n@layer components {\n  .day-cell {\n    inline-size: var(--cell-size);\n    block-size: var(--cell-size);\n    border-radius: 2px;\n    background: var(--color-level-0);\n  }\n\n  .legend-swatch {\n    display: inline-block;\n    inline-size: var(--cell-size);\n    block-size: var(--cell-size);\n    border-radius: 2px;\n    background: var(--color-level-0);\n  }\n\n  :is(.day-cell, .legend-swatch)[data-level=\"1\"] {\n    background: var(--color-level-1);\n  }\n  :is(.day-cell, .legend-swatch)[data-level=\"2\"] {\n    background: var(--color-level-2);\n  }\n  :is(.day-cell, .legend-swatch)[data-level=\"3\"] {\n    ba <script>
  const manifest = JSON.parse(document.getElementById("manifest").textContent);
  const select = document.getElementById("demo-select");
  const preview = document.getElementById("preview");

  for (const demo of manifest) {
    const option = document.createElement("option");
    option.value = demo.id;
    option.textContent = `${demo.lab} / ${demo.title}`;
    select.appendChild(option);
  }

  function currentDemo() {
    return manifest.find((d) => d.id === select.value);
  }

  function renderPreview() {
    const demo = currentDemo();
    if (!demo) return;
    // The embedded closing script tag below must stay backslash-escaped:
    // unescaped, even inside a JS string, it's still what the HTML
    // tokenizer scans for to end this element's own closing tag, and
    // would truncate this whole inline script right there.
    const scriptTag = demo.js ? `<script>${demo.js}<\/script>` : "";
    preview.srcdoc = `<!doctype html><html><head><style>${demo.css}</style></head><body>${demo.html}${scriptTag}</body></html>`;
  }

  select.addEventListener("change", renderPreview);
  renderPreview();

  document.getElementById("open-codepen").addEventListener("click", () => {
    const demo = currentDemo();
    if (!demo) return;
    const data = { title: demo.title, html: demo.html, css: demo.css, js: demo.js };

    const form = document.createElement("form");
    form.action = "https://codepen.io/pen/define";
    form.method = "POST";
    form.target = "_blank";

    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "data";
    input.value = JSON.stringify(data);
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
    form.remove();
  });
</script>
