<body>
<header>
  <h1>Chained Albatross</h1>
  <p>Two calc() switches chained together: four cards move from a single row, to a 2-column grid, to a fully stacked column — three distinct states from pure math, no @container.</p>
</header>
<div class="stage">
  <div class="chain">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
  </div>
</div>
</body>
