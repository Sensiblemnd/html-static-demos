<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Personality Card</title>
<link rel="stylesheet" href="../_shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Responsive Personality Card</h1>
  <p>The same card changes from a tiny alert to a richer information card as its container grows.</p>
</header>
<div class="stage">
  <article class="alert">
    <div class="icon">⚡</div>
    <div class="copy"><strong>Suspicious activity</strong><span>Reported near downtown</span></div>
    <time>3 min ago</time>
    <button>View map →</button>
  </article>
</div>
</body>
</html>
