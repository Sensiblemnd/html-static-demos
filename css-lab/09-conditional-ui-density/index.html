<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conditional UI Density</title>
<link rel="stylesheet" href="../_shared.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Conditional UI Density</h1>
  <p>A data view removes secondary columns as its container gets smaller, preserving the most useful information.</p>
</header>
<div class="stage">
  <div class="table">
    <div class="row head"><b>Name</b><b>Status</b><b>Updated</b><b>Owner</b></div>
    <div class="row"><span>Project A</span><span>Active</span><span>2 min</span><span>Rob</span></div>
    <div class="row"><span>Project B</span><span>Pending</span><span>8 min</span><span>Sarah</span></div>
    <div class="row"><span>Project C</span><span>Active</span><span>12 min</span><span>Alex</span></div>
  </div>
</div>
</body>
</html>
